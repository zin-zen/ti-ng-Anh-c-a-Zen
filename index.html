<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS cho Zen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E6A65">
<meta name="author" content="Papa-Phí Mạnh Trường">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IELTS cho Zen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F6F1; --surface:#FFFFFF; --surface2:#E3EEE6; --ink:#17323A; --muted:#55696C;
  --teal:#0E6A65; --on-teal:#FFFFFF; --sun:#FFC23D; --on-sun:#17323A; --rose:#C93A55; --rose-bg:#FCE6EA;
  --lilac:#6A5FCB; --good:#1E7A44; --good-bg:#DDF2E4; --line:#C9D9CF; --skin:#F4C9A8; --skin2:#E3A882;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1C1F; --surface:#162A2E; --surface2:#1E363B; --ink:#E4EFEC; --muted:#9BB2B0;
    --teal:#4CBDB3; --on-teal:#0B1A1C; --sun:#FFCE5C; --on-sun:#17323A; --rose:#FF7F95; --rose-bg:#3A1F27;
    --lilac:#9E94F0; --good:#6FD39A; --good-bg:#16352A; --line:#2C464B; --skin:#E9BC99; --skin2:#C98E6A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1C1F; --surface:#162A2E; --surface2:#1E363B; --ink:#E4EFEC; --muted:#9BB2B0;
  --teal:#4CBDB3; --on-teal:#0B1A1C; --sun:#FFCE5C; --on-sun:#17323A; --rose:#FF7F95; --rose-bg:#3A1F27;
  --lilac:#9E94F0; --good:#6FD39A; --good-bg:#16352A; --line:#2C464B; --skin:#E9BC99; --skin2:#C98E6A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3{font-family:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;line-height:1.15;margin:0 0 .35em;font-weight:700}
h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0 0 .8em}
img,svg{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

/* Teacher header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--line)}
.teacher{display:flex;gap:10px;align-items:flex-end;max-width:780px;margin:0 auto;padding:10px 14px 8px}
.avatar{position:relative;width:84px;height:100px;flex:none}
.avatar canvas{position:absolute;inset:0;width:100%;height:100%;display:none}
.avatar.has3d canvas{display:block}
.avatar.has3d .robot2d{display:none}
.robot2d{width:100%;height:100%;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.bubble{flex:1;background:var(--surface);border:2px solid var(--ink);border-radius:20px 20px 20px 6px;padding:8px 12px;min-height:58px;font-size:.95rem;position:relative}
.bubble b.name{font-family:"Baloo 2",sans-serif;color:var(--lilac);font-size:.95rem;display:block;line-height:1.1}
.bubble .vi{display:block;color:var(--rose);font-weight:600;margin-top:2px}
.bubble.firm{border-color:var(--rose);background:var(--rose-bg)}
.statusbar{display:flex;gap:8px;align-items:center;max-width:780px;margin:0 auto;padding:0 14px 8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;background:var(--surface2)}
.pill.timer{background:var(--ink);color:var(--paper);font-variant-numeric:tabular-nums}
.pill.paused{background:var(--rose);color:#fff}
.iconbtn{border:0;background:var(--surface2);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.85rem;font-weight:600;margin-left:auto}

/* teacher animation */
.head{transform-origin:60px 112px;animation:sway 7s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.mouth{transform-box:fill-box;transform-origin:center}
.talking .mouth{animation:talk .2s ease-in-out infinite alternate}
.talking .head{animation:nod 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes nod{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(1.5deg) translateY(1px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@media (prefers-reduced-motion:reduce){.head,.eyes,.talking .mouth,.talking .head{animation:none}}

main{max-width:780px;margin:0 auto;padding:18px 16px 24px}
.credit{max-width:780px;margin:0 auto;padding:4px 16px calc(100px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.welcome .hello{font-family:"Baloo 2",sans-serif;font-size:1.45rem;font-weight:700;line-height:1.25;margin-bottom:6px}
.welcome h3{margin-top:14px}
.welcome ul{margin:4px 0 8px;padding-left:20px}
.welcome .en{border-top:2px dashed var(--line);margin-top:14px;padding-top:10px;color:var(--muted)}
.sq{margin:12px 0}.sqq{font-weight:600;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.chat{max-width:520px}
.chatlog{max-height:48vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{padding:8px 12px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--teal);color:var(--on-teal)}
.msg.a{align-self:flex-start;background:var(--surface2)}
.msg .say{border:0;background:none;cursor:pointer;margin-left:4px;font-size:1rem}
#askBtn{background:var(--sun);color:var(--on-sun)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:195px;border:0;background:none;padding:9px 4px 10px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button span{font-size:1.35rem;line-height:1}
.tabs button[aria-current="page"]{color:var(--teal)}
.tabs button[aria-current="page"] span{transform:translateY(-2px)}
.tabs.locked{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;border:2px solid var(--ink);background:var(--sun);color:var(--on-sun);border-radius:14px;padding:11px 18px;box-shadow:0 3px 0 var(--ink);cursor:pointer;text-decoration:none;min-height:46px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.teal{background:var(--teal);color:var(--on-teal)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn.danger{background:var(--rose);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.today{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.today .ring{flex:none}
.today h2{margin:0}
.banner{border:2px solid var(--rose);background:var(--rose-bg);border-radius:16px;padding:12px 14px;margin:0 0 16px;font-weight:600}
.banner.ok{border-color:var(--good);background:var(--good-bg);color:var(--ink)}

.modlist{display:grid;gap:10px}
.mod{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:2px solid var(--ink);background:var(--surface);border-radius:18px;padding:12px 14px;cursor:pointer}
.mod:active{transform:translateY(1px)}
.mod .ic{font-size:1.8rem;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--surface2)}
.mod .t{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.15rem;line-height:1.15}
.mod .s{color:var(--muted);font-size:.88rem}
.mod .sc{font-weight:700;font-size:.9rem;color:var(--teal);text-align:right}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.flash{text-align:center;padding:26px 16px}
.flash .word{font-family:"Baloo 2",sans-serif;font-size:2.6rem;font-weight:800;line-height:1;margin:6px 0 2px;letter-spacing:.01em}
.flash .vi{font-size:1.25rem;font-weight:700;color:var(--teal);margin:10px 0}
.flash .ex{font-style:italic;color:var(--muted);max-width:52ch;margin:0 auto 16px}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.progress i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}

.choices{display:grid;gap:8px;margin-top:12px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;font-weight:600}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--rose);background:var(--rose-bg)}
input[type=text],input[type=email],input[type=number],input[type=password],input[type=date],textarea,select{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
input:focus,textarea:focus{border-color:var(--teal);outline:none}
textarea{min-height:260px;line-height:1.6;resize:vertical}
label.f{display:block;font-weight:600;margin:10px 0 4px;font-size:.92rem}

.passage{max-height:46vh;overflow:auto;border:2px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);font-family:Georgia,"Times New Roman",serif;line-height:1.75;margin-bottom:14px}
.passage p{max-width:68ch}
.q{border:0;margin:0 0 14px;padding:0}
.q legend,.q .ql{font-weight:600;margin-bottom:6px;display:block}
.qn{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:.8rem;margin-right:6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:2px solid var(--line);border-radius:12px;margin:5px 0;cursor:pointer;background:var(--surface)}
.opt input{margin-top:5px}
.review{padding:10px 12px;border-radius:12px;margin:6px 0 12px;font-size:.92rem}
.review.ok{background:var(--good-bg)} .review.no{background:var(--rose-bg)}

.result{text-align:center;padding:22px 16px}
.result .big{font-family:"Baloo 2",sans-serif;font-size:4rem;font-weight:800;line-height:1;color:var(--teal)}
.sticker-pop{font-size:4rem;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}

.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;background:var(--surface2);border-radius:18px;padding:12px;margin-bottom:14px}
.slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;background:var(--surface);border:2px dashed var(--line)}
.slot.on{border:2px solid var(--ink);background:var(--sun);transform:rotate(var(--r,0deg))}
.slot.used{opacity:.35;filter:grayscale(1)}

table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.crit{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.crit div{background:var(--surface2);border-radius:12px;padding:8px;text-align:center}
.crit b{display:block;font-size:1.3rem;font-family:"Baloo 2",sans-serif}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-weight:600}
.report{white-space:pre-wrap;line-height:1.65}
.mic.on{background:var(--rose);color:#fff}
.phases{display:flex;gap:4px;margin:10px 0 16px}
.phases div{flex:var(--w) 1 0;min-width:0;background:var(--surface2);border-radius:10px;padding:6px 8px;font-size:.78rem;line-height:1.3}
.phases .past{background:var(--good-bg)}
.phases .cur{background:var(--teal);color:var(--on-teal);font-weight:700}
.wk.now{border-color:var(--teal)}
.wk table.t th{width:92px;color:var(--muted);font-weight:600}
.i{width:22px;height:22px;display:block}
.mod .ic{transition:transform .15s}
.mod .ic svg{width:28px;height:28px}
.mod:active .ic{transform:rotate(-6deg) scale(1.06)}
.ic.sm{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;flex:none}
.ic.sm svg{width:20px;height:20px}
.progress i{background:var(--skill,var(--teal))}
.tabs .ti{width:32px;height:28px;display:grid;place-items:center;border-radius:10px;transition:background .2s}
.tabs button[aria-current="page"] .ti{background:var(--teal);color:var(--on-teal);transform:none}
.iconbtn{display:inline-flex;align-items:center;gap:4px}
.iconbtn .i{width:16px;height:16px}
.iconbtn+.iconbtn{margin-left:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,22,.55);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:20px;max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:.9rem}
.loading{text-align:center;padding:40px 10px}
.dots::after{content:"…";animation:d 1.2s steps(3) infinite}
@keyframes d{0%{content:"."}33%{content:".."}66%{content:"..."}}
@media (min-width:640px){.avatar{width:104px;height:120px}.bubble{font-size:1rem}}
</style>
</head>
<body>
<div class="top">
  <div class="teacher">
    <div class="avatar" id="avatar"><canvas id="robot3d" aria-hidden="true"></canvas>
    <svg class="robot2d" viewBox="0 0 120 140" aria-hidden="true">
      <g class="head"><line x1="60" y1="22" x2="60" y2="9" stroke="#8D99A6" stroke-width="3"/><circle cx="60" cy="8" r="4.5" fill="#2EC4B6"/>
      <rect x="13" y="44" width="11" height="22" rx="5.5" fill="#8D99A6"/><rect x="96" y="44" width="11" height="22" rx="5.5" fill="#8D99A6"/>
      <rect x="21" y="20" width="78" height="72" rx="36" fill="#F3F5F7" stroke="#C9D3DC" stroke-width="2"/>
      <rect x="31" y="35" width="58" height="40" rx="19" fill="#0A1320"/>
      <g class="eyes"><ellipse cx="48" cy="52" rx="6" ry="7" fill="#6FF5E6"/><ellipse cx="72" cy="52" rx="6" ry="7" fill="#6FF5E6"/></g>
      <rect class="mouth" x="51" y="63" width="18" height="4" rx="2" fill="#6FF5E6"/></g>
      <path d="M24 140c2-22 16-35 36-35s34 13 36 35z" fill="#F3F5F7" stroke="#C9D3DC" stroke-width="2"/><circle cx="60" cy="123" r="5" fill="#2EC4B6"/>
    </svg></div>
    <div class="bubble" id="bubble" aria-live="polite"><b class="name" id="bubbleName">Cô Lan Anh</b><span id="bubbleText">Chào con! Cô đang chuẩn bị bài học hôm nay.</span></div>
  </div>
  <div class="statusbar">
    <span class="pill" id="todayPill">Hôm nay 0/30 phút</span>
    <span class="pill timer" id="timerPill" hidden>⏱ 00:00</span>
    <button class="iconbtn" id="askBtn" aria-label="Hỏi cô giáo"></button>
    <button class="iconbtn" id="voiceBtn" aria-label="Chọn giáo viên và giọng nói"></button>
    <button class="iconbtn" id="muteBtn" aria-pressed="false" aria-label="Bật hoặc tắt tiếng"></button>
  </div>
</div>

<main id="main"></main>
<footer class="credit">design by Papa-Phí Mạnh Trường</footer>

<nav class="tabs" id="tabs">
  <button data-tab="home" aria-current="page"><span class="ti" data-icon="home"></span>Học</button>
  <button data-tab="mock"><span class="ti" data-icon="mock"></span>Thi thử</button>
  <button data-tab="plan"><span class="ti" data-icon="plan"></span>Lộ trình</button>
  <button data-tab="stickers"><span class="ti" data-icon="stickers"></span>Sticker</button>
  <button data-tab="parent"><span class="ti" data-icon="parent"></span>Bố mẹ</button>
</nav>

<script src="three.min.js"></script>
<script>

const WORDS=[

["consume","v","tiêu thụ","Large cities consume huge amounts of energy."],
["diverse","adj","đa dạng","Singapore has a diverse population."],
["eliminate","v","loại bỏ","The aim is to eliminate plastic bags completely."],
["exceed","v","vượt quá","Demand exceeded supply last year."],

["generate","v","tạo ra","Solar panels generate clean electricity."],
["hinder","v","cản trở","Lack of sleep can hinder concentration."],
["implement","v","thực hiện, triển khai","The government implemented a new policy."],
["incentive","n","sự khuyến khích","Tax cuts are an incentive for small businesses."],
["infrastructure","n","cơ sở hạ tầng","Good infrastructure attracts investment."],
["justify","v","biện minh, chứng minh là đúng","It is hard to justify such high prices."],
["legislation","n","luật pháp","New legislation protects consumers."],
["migrate","v","di cư","Many young people migrate to big cities for work."],
["negligible","adj","không đáng kể","The difference in cost is negligible."],
["obsolete","adj","lỗi thời","Some jobs may become obsolete because of AI."],
["perceive","v","nhận thức, cảm nhận","Many people perceive exams as stressful."],
["priority","n","ưu tiên","Safety should be the top priority."],
["prohibit","v","cấm","Smoking is prohibited in public buildings."],
["proportion","n","tỷ lệ","A large proportion of students use phones in class."],

const Robot=(()=>{

    scene.add(new THREE.HemisphereLight(0xffffff,0x6b7d8c,.9));
    const key=new THREE.DirectionalLight(0xffffff,.85);key.position.set(2.5,3,4);scene.add(key);
    const rim=new THREE.DirectionalLight(0x9fe8ff,.45);rim.position.set(-3,1.5,-2.5);scene.add(rim);
    const white=new THREE.MeshStandardMaterial({color:0xf3f5f7,roughness:.32,metalness:.05});

    const chest=new THREE.Mesh(new THREE.CircleGeometry(.11,32),glow());chest.position.set(0,-1.2,.645);scene.add(chest);
    const neck=new THREE.Mesh(new THREE.CylinderGeometry(.2,.26,.4,24),grey);neck.position.y=-.62;scene.add(neck);
    [-1,1].forEach(s=>{const sh=new THREE.Mesh(new THREE.SphereGeometry(.27,24,18),white);sh.position.set(s,-1,0);scene.add(sh)});
    armPivot=new THREE.Group();armPivot.position.set(1,-1,0);scene.add(armPivot);
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(.13,.12,.8,20),white);arm.position.y=-.45;armPivot.add(arm);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.15,20,14),grey);hand.position.y=-.9;armPivot.add(hand);
    pivot=new THREE.Group();pivot.position.y=-.45;scene.add(pivot);
    inner=new THREE.Group();inner.position.y=.85;inner.scale.set(1.08,.95,1);pivot.add(inner);
    inner.add(new THREE.Mesh(new THREE.SphereGeometry(1,56,40),white));
    inner.add(new THREE.Mesh(new THREE.SphereGeometry(1.012,56,40,Math.PI/2-.88,1.76,.9,1.2),visor));
    [-1,1].forEach(s=>{
      const ear=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.14,32),grey);ear.rotation.z=Math.PI/2;ear.position.x=s*1.02;inner.add(ear);
      const ring=new THREE.Mesh(new THREE.TorusGeometry(.16,.03,10,36),glow());ring.rotation.y=Math.PI/2;ring.position.x=s*1.1;inner.add(ring);

    });
    eyes.concat(brows,cheeks).forEach(m=>inner.add(m));
    for(let i=-3;i<=3;i++){const b=onHead(new THREE.Mesh(new THREE.PlaneGeometry(.05,.06),eyeMat),1.8,Math.PI/2+i*.075,1.03);b.userData.i=i;bars.push(b);inner.add(b)}
    const ant=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.3,12),grey);ant.position.y=1.1;inner.add(ant);
    const ball=new THREE.Mesh(new THREE.SphereGeometry(.07,16,12),glow());ball.position.y=1.28;inner.add(ball);

      if(g>2.2)gest=null}
    pivot.rotation.set(rx,ry,rz);armPivot.rotation.z=arm;
    renderer.render(scene,cam);
  }
  return {init,mood(m){moodT=m},talk(on){talking=on;if(on)amp=.6},pulse(){amp=1},gesture(g){gest=g;gT=clock.elapsedTime},setAccent(hex,ck){accent.setHex(hex);cheeks.forEach(c=>c.visible=!!ck)}};
})();

const avatar=$("#avatar");let muted=false,voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){voices=[]}}

function voicesFor(l){return voices.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith(l))}
const MALE_EN=/daniel|arthur|oliver|george|ryan|guy|thomas|rishi|aaron|\bmale\b/i;
function pickVoice(lang){
  const list=voicesFor(lang==="vi"?"vi":"en");if(!list.length)return null;
  const chosen=lang==="vi"?VS.vi:VS.en;if(chosen){const v=list.find(v=>v.voiceURI===chosen);if(v)return v}
  const p=persona();
  if(lang==="vi")return list.find(v=>p.hint.test(v.name))||list[0];
  const gb=list.filter(v=>/en-gb/i.test((v.lang||"").replace("_","-"))).concat(list);
  const g=p.male?MALE_EN:/serena|kate|sonia|libby|martha|samantha|karen|moira|tessa|stephanie|catherine|female/i;
  return gb.find(v=>g.test(v.name))||gb[0];
}
function T(s){if(!persona().male)return s;return s.replace(/(^|[\s,.!?“"])Cô(?=[\s,.!?]|$)/g,"$1Thầy").replace(/(^|[\s,.!?“"])cô(?=[\s,.!?]|$)/g,"$1thầy")}
function viText(s){s=T(s);if(VS.teacher==="mai-nam")s=s.replace(/ nhé/g," nha").replace(/ đấy/g," đó");return s}
function speak(text,lang="en",opts={}){return new Promise(res=>{
  if(muted||!("speechSynthesis" in window)||!text){res();return}
  const v=pickVoice(lang);if(lang==="vi"&&!v){res();return}
  const p=persona(),soft=VS.speed!=="normal";
  const u=new SpeechSynthesisUtterance(text);if(v)u.voice=v;u.lang=lang==="vi"?"vi-VN":(v?v.lang:"en-GB");
  const maleVoice=!!v&&(lang==="en"?MALE_EN.test(v.name):(p.male&&p.hint.test(v.name)));
  u.rate=opts.rate||(lang==="vi"?(soft?.92:1):(soft?.88:.97));
  u.pitch=opts.pitch||(p.male?(maleVoice?1:.8):1.08);
  u.onstart=()=>{avatar.classList.add("talking");Robot.talk(true)};
  u.onboundary=()=>Robot.pulse();
  u.onend=u.onerror=()=>{avatar.classList.remove("talking");Robot.talk(false);res()};
  speechSynthesis.speak(u);
})}
function say(en,vi,firm=false,mood){

/* ============ Session timing ============ */
let session=null,lastAct=Date.now();
["pointerdown","keydown","scroll","input"].forEach(ev=>addEventListener(ev,()=>lastAct=Date.now(),{passive:true}));
function beginSession(type,extra={}){session={type,start:new Date().toISOString(),active:0,rushed:0,firmRush:false,...extra};main.style.setProperty("--skill",SKILL_COLOR[type]||"");$("#tabs").classList.add("locked");$("#timerPill").hidden=false;tick()}
function speakingNow(){try{return speechSynthesis.speaking}catch(e){return false}}
function tick(){

function endSession(score,details={},opts={}){
  const s=session;if(!s)return null;
  const rec={id:Date.now().toString(36),date:dayKey(),type:s.type,start:s.start,secs:s.active,score:score==null?null:Math.round(score*10)/10,band:details.band??null,rushed:s.rushed,status:opts.abandoned?"bỏ dở":"xong",details};

/* ============ AI helpers ============ */
let sampleFn;
async function getSample(){
  if(window.claude&&claude.use){if(sampleFn===undefined){try{sampleFn=await claude.use("sample")}catch(e){sampleFn=null}}if(sampleFn)return sampleFn}
  return S.settings.apiKey?makeApiSample():null;
}
function makeApiSample(){
  const call=async(input,opts={})=>{
    const messages=typeof input==="string"?[{role:"user",content:input}]:input;
    let r;
    try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.settings.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:S.settings.apiModel||"claude-sonnet-5-5",max_tokens:4000,messages})})}
    catch(e){throw {code:"offline",message:String(e)}}
    if(!r.ok){const t=await r.text();throw {code:r.status===401||r.status===403?"bad_key":r.status===429?"rate_limited":"error",message:t}}
    const d=await r.json();const text=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    if(opts.onText)opts.onText({text,delta:text});
    return {text,truncated:d.stop_reason==="max_tokens"};
  };
  call.json=async(input,opts)=>{const {text}=await call(input,opts);const t=text.replace(/```json|```/g,"").trim();const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));return JSON.parse(t.slice(a,b+1))};
  return call;
}
function loading(msg){main.innerHTML=`<div class="loading"><div style="font-size:2.4rem">📝</div><h3 class="dots">${esc(msg)}</h3><p class="muted small">Có thể mất 30–90 giây.</p></div>`}
function validateSet(set,needLines){
  if(!set||!Array.isArray(set.questions)||!set.questions.length)return null;
  if(needLines&&(!Array.isArray(set.lines)||!set.lines.length))return null;
  const qs=[];
  for(const q of set.questions){
    if(!q||!q.q||q.answer==null)continue;
    const type=["tfng","mcq","gap"].includes(q.type)?q.type:(Array.isArray(q.options)?"mcq":"gap");
    let ans=q.answer;
    if(type==="tfng"){ans=String(Array.isArray(ans)?ans[0]:ans).toUpperCase().replace("NOTGIVEN","NOT GIVEN");if(!["TRUE","FALSE","NOT GIVEN"].includes(ans))continue}
    if(type==="mcq"){if(!Array.isArray(q.options)||q.options.length<2)continue;ans=Array.isArray(ans)?ans[0]:ans;if(!q.options.includes(ans)){const i="ABCDE".indexOf(String(ans).trim().toUpperCase()[0]);if(i>=0&&q.options[i])ans=q.options[i];else continue}}
    if(type==="gap"){ans=(Array.isArray(ans)?ans:[ans]).map(String)}
    qs.push({type,q:String(q.q),options:q.options,answer:ans,explain:q.explain||""});
  }
  if(!qs.length)return null;set.questions=qs;return set;
}
async function genReading(n=8,mock=false){
  const sample=await getSample();if(!sample)return null;
  const topic=mock?pick(TOPICS):planInfo().focus.en+" (choose one specific, interesting angle)",words=n>10?700:(levelBand()<5.5?320:420);
  const prompt=`You are an experienced IELTS Academic test writer. Write an ORIGINAL reading passage in the style of recent IELTS Academic tests (2023-2026). Topic: ${topic}. Length about ${words} words, academic register, ${aiLevel(mock)} difficulty, 4-6 paragraphs. Then write exactly ${n} questions, mixing three types: "tfng" (True/False/Not Given), "mcq" (4 options), "gap" (sentence completion, NO MORE THAN TWO WORDS taken from the passage). Include at least one NOT GIVEN and paraphrase rather than copying sentences.
Return ONLY JSON, no markdown: {"title":string,"passage":string (paragraphs separated by \\n\\n),"questions":[{"type":"tfng"|"mcq"|"gap","q":string,"options":[4 strings, only for mcq],"answer": for tfng exactly "TRUE","FALSE" or "NOT GIVEN"; for mcq the exact option text; for gap an array of accepted answers,"explain":"one short sentence in Vietnamese saying where the answer is"}]}`;
  try{return validateSet(await sample.json(prompt,{modelTier:"default"}))}catch(e){aiFail(e);return null}
}
async function genListening(n=8,section=1,mock=false){
  const sample=await getSample();if(!sample)return null;
  const kinds={1:"Section 1: an everyday conversation between two speakers (e.g. booking, enquiry) with form completion — include spelling of a name and numbers, plus at least one distractor where a speaker corrects themselves",2:"Section 2: a monologue by a guide or presenter about a local facility or event, with map-free sentence completion and multiple choice",3:"Section 3: a discussion between two students about an assignment, with multiple choice and sentence completion"};
  const prompt=`You are an IELTS Listening test writer. Write an ORIGINAL ${kinds[section]||kinds[1]}, in the style of recent IELTS tests (2023-2026), ${aiLevel(mock)} difficulty, topic related to ${mock?"any everyday or study context":planInfo().focus.en}, about 350 words of dialogue/monologue, natural spoken British English. Then write exactly ${n} questions in the order the answers are heard, types "gap" (NO MORE THAN TWO WORDS AND/OR A NUMBER) or "mcq" (3 options).
Return ONLY JSON, no markdown: {"title":string,"context":"one sentence in English describing the situation","lines":[{"speaker":"A"|"B","text":string}],"questions":[{"type":"gap"|"mcq","q":string,"options":[3 strings, only for mcq],"answer": for mcq the exact option text; for gap an array of accepted spellings/forms,"explain":"one short sentence in Vietnamese"}]}`;
  try{return validateSet(await sample.json(prompt,{modelTier:"default"}),true)}catch(e){aiFail(e);return null}
}
function aiFail(e){if(e&&e.code==="bad_key")toast("Khoá API chưa đúng. Bố mẹ kiểm tra lại trong Cài đặt.");else if(e&&e.code==="offline")toast("Không có mạng, cô dùng đề có sẵn.");else if(e&&e.code==="not_granted")toast("Chưa cho phép dùng AI, cô dùng đề có sẵn.");else if(e&&e.code==="rate_limited")toast("AI đang bận, thử lại sau ít phút.");else toast("Chưa tạo được đề mới, cô dùng đề có sẵn.")}

/* ============ Vocabulary ============ */
function computeQuota(){const v=S.sessions.filter(s=>s.type==="vocab"&&s.score!=null).slice(-3);let n=levelBand()<5?10:12;if(v.length){const a=v.reduce((x,s)=>x+s.score,0)/v.length;if(a>=9)n=18;else if(a>=8)n=15;else if(a<5)n=10}return Math.max(8,Math.min(20,n+surveyAdj()*4))}
function pickWords(n){const pool=allWords();const wrongs=shuffle(pool.filter(w=>(S.wrong[w.w]||0)>0)).slice(0,Math.ceil(n/3));const un=pool.filter(w=>!S.learned[w.w]&&!wrongs.includes(w));const fresh=shuffle(un.filter(w=>w.b1)).concat(shuffle(un.filter(w=>!w.b1)));const old=shuffle(pool.filter(w=>S.learned[w.w]&&!wrongs.includes(w)));return wrongs.concat(fresh,old).slice(0,n)}
function startVocab(){
  const n=computeQuota();const words=pickWords(n);
  beginSession("vocab");
  say(`Today you will learn ${n} words. Read each card slowly, then I'll test you.`);
  vocabLearn(words,0);
}
function vocabLearn(words,i){
  if(i>=words.length)return vocabQuiz(words);
  const w=words[i];
  main.innerHTML=`${sessionHead("Từ vựng")}<div class="progress"><i style="width:${i/words.length*100}%"></i></div><p class="muted small">Thẻ ${i+1}/${words.length} · Học thẻ, sau đó làm bài kiểm tra</p>
  <div class="panel flash"><div class="muted small">${esc(w.pos)}</div><div class="word">${esc(w.w)}</div><div class="vi">${esc(w.vi)}</div><p class="ex">“${esc(w.ex)}”</p>
  <div class="row" style="justify-content:center"><button class="btn ghost" id="hear">🔊 Nghe</button><button class="btn teal" id="next" disabled>Đọc kỹ… 3</button></div></div>`;
  bindQuit();
  $("#hear").onclick=async()=>{await speak(w.w);await speak(w.ex,"en",{rate:.9})};
  speak(w.w);
  let c=3;const nb=$("#next");const iv=setInterval(()=>{c--;if(!document.body.contains(nb)){clearInterval(iv);return}if(c<=0){clearInterval(iv);nb.disabled=false;nb.textContent=i===words.length-1?"Bắt đầu kiểm tra":"Thẻ tiếp"}else nb.textContent=`Đọc kỹ… ${c}`},1000);
  nb.onclick=()=>vocabLearn(words,i+1);
}
function vocabQuiz(words){
  const pool=allWords();
  const qs=shuffle(words).map((w,i)=>i%2===0?{kind:"mcq",w,opts:shuffle([w.vi,...shuffle(pool.filter(x=>x.w!==w.w)).slice(0,3).map(x=>x.vi)])}:{kind:"type",w});
  const wrong=[];let correct=0;
  say("Quiz time. No rushing — read every option before you choose.");
  const show=i=>{
    if(i>=qs.length)return vocabFix(words,wrong,correct,qs.length);
    const q=qs[i],t0=Date.now();
    main.innerHTML=`${sessionHead("Kiểm tra từ vựng")}<div class="progress"><i style="width:${i/qs.length*100}%"></i></div><p class="muted small">Câu ${i+1}/${qs.length}</p><div class="panel" id="qp">${q.kind==="mcq"?`<p class="small muted">Chọn nghĩa đúng của từ</p><div class="flash" style="padding:6px"><div class="word">${esc(q.w.w)}</div></div><div class="choices">${q.opts.map(o=>`<button class="choice">${esc(o)}</button>`).join("")}</div>`:`<p class="small muted">Gõ từ tiếng Anh có nghĩa</p><div class="flash" style="padding:6px"><div class="vi" style="font-size:1.5rem">${esc(q.w.vi)}</div><p class="muted">Gợi ý: bắt đầu bằng “${esc(q.w.w[0])}”, ${q.w.w.length} chữ cái</p></div><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row" style="margin-top:10px"><button class="btn teal" id="ok">Kiểm tra</button></div>`}</div>`;
    bindQuit();
    const finish=(ok,btn)=>{
      const dt=(Date.now()-t0)/1000;
      if(dt<1.5&&q.kind==="mcq"){session.rushed++;if(session.rushed>=3&&!session.firmRush){session.firmRush=true;say("Slow down, please.",FIRM.rush,true)}}
      if(ok){correct++;S.learned[q.w.w]=true;S.wrong[q.w.w]=Math.max(0,(S.wrong[q.w.w]||0)-1)}else{wrong.push(q.w);S.wrong[q.w.w]=(S.wrong[q.w.w]||0)+1}
      setTimeout(()=>show(i+1),ok?650:1500);
    };
    if(q.kind==="mcq"){main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{main.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.textContent===q.w.vi)x.classList.add("right")});const ok=b.textContent===q.w.vi;if(!ok)b.classList.add("wrong");finish(ok)})}
    else{const inp=$("#ans");inp.focus();const go=()=>{if(!inp.value.trim())return;const ok=norm(inp.value)===norm(q.w.w);inp.disabled=true;$("#ok").disabled=true;inp.insertAdjacentHTML("afterend",`<div class="review ${ok?"ok":"no"}">${ok?"Chính xác!":"Đáp án: <b>"+esc(q.w.w)+"</b>"}</div>`);finish(ok)};$("#ok").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()}}
  };
  show(0);
}
function vocabFix(words,wrong,correct,total){
  if(!wrong.length)return vocabDone(correct,total,words);
  say("Now let's fix the mistakes. Type each word correctly once.","Con gõ lại đúng từng từ sai nhé.");
  const step=i=>{
    if(i>=wrong.length)return vocabDone(correct,total,words);
    const w=wrong[i];
    main.innerHTML=`${sessionHead("Sửa lỗi")}<p class="muted small">Từ sai ${i+1}/${wrong.length} · Gõ lại đúng chính tả để đi tiếp</p><div class="panel flash"><div class="word">${esc(w.w)}</div><div class="vi">${esc(w.vi)}</div><p class="ex">“${esc(w.ex)}”</p><input type="text" id="fx" placeholder="Gõ lại từ ở đây" autocomplete="off" autocapitalize="off" spellcheck="false" style="max-width:320px;text-align:center"></div>`;
    bindQuit();speak(w.w);
    const inp=$("#fx");inp.focus();inp.oninput=()=>{if(norm(inp.value)===norm(w.w)){inp.disabled=true;setTimeout(()=>step(i+1),400)}};
  };
  step(0);
}
function vocabDone(correct,total,words){
  const score=correct/total*10;
  const rec=endSession(score,{correct,total,words:words.map(w=>w.w)});
  showResult(rec,`${correct}/${total} câu đúng`);
}

/* ============ Reading & Listening ============ */
async function chooseSource(skill){
  const label=skill==="reading"?"Đọc hiểu":"Nghe";

  if(r.i===2)return;

  beginSession(skill);
  runQuizSet(clone(set),skill,{onDone:res=>{const rec=endSession(res.correct/res.total*10,{correct:res.correct,total:res.total,band:rawToBand(res.correct/res.total*40),title:set.title});showResult(rec,`${res.correct}/${res.total} câu đúng · ước tính band ${rawToBand(res.correct/res.total*40)}`)}});
}
function qHTML(q,i){
  if(q.type==="gap")return `<div class="q"><label class="ql" for="g${i}"><span class="qn">${i+1}</span>${esc(q.q)}</label><input type="text" id="g${i}" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;

  return `<fieldset class="q"><legend><span class="qn">${i+1}</span>${esc(q.q)}</legend>${opts.map(o=>`<label class="opt"><input type="radio" name="q${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</fieldset>`;

function getAnswer(q,i){if(q.type==="gap"){const e=$("#g"+i);return e?e.value.trim():""}const c=main.querySelector(`input[name="q${i}"]:checked`);return c?c.value:""}
function isRight(q,a){if(!a)return false;if(q.type==="gap")return q.answer.some(x=>norm(x)===norm(a));return norm(a)===norm(q.answer)}
function runQuizSet(set,skill,opts){
  const mock=!!opts.mock,maxPlays=mock?1:2;let plays=0,playing=false;
  const t0=Date.now();
  const head=sessionHead(set.title||SKILL_NAME[skill],opts.timeLimit?`<span class="pill timer" id="countdown">${fmtTime(opts.timeLimit)}</span>`:"");
  const top=skill==="grammar"?"":skill==="reading"?`<div class="passage">${String(set.passage).split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:
    `<div class="panel"><p><b>Tình huống:</b> ${esc(set.context||"")}</p><div class="row"><button class="btn teal" id="play">▶ Nghe bài (còn ${maxPlays} lượt)</button></div><p class="muted small" style="margin-top:8px">${mock?"Như thi thật: chỉ nghe 1 lần.":"Luyện tập: được nghe 2 lần."} Đọc trước câu hỏi bên dưới trước khi bấm nghe.</p></div>`;
  main.innerHTML=`${head}${opts.partLabel?`<p class="muted small">${esc(opts.partLabel)}</p>`:""}${top}<form id="qf" class="panel" onsubmit="return false">${set.questions.map(qHTML).join("")}<div class="row"><button class="btn" id="submit">Nộp bài</button></div></form>`;
  bindQuit();
  if(opts.timeLimit){session.countdown=opts.timeLimit;session.onTimeUp=()=>{say("Time is up. Pens down.");grade(true)}}
  if(skill==="listening"){
    const pb=$("#play");

      if(playing){try{speechSynthesis.cancel()}catch(e){}playing=false;return}
      if(plays>=maxPlays)return;plays++;playing=true;session.listening=true;pb.textContent="⏹ Dừng";

    const blanks=answers.filter(a=>!a).length;
    if(!force){
      if(blanks){say("Check again before you submit.",FIRM.blank,true);const r=await modal(`<h3>Còn ${blanks} câu bỏ trống</h3><p>Ở IELTS, bỏ trống chắc chắn mất điểm. Con kiểm tra lại nhé?</p>`,[{label:"Kiểm tra lại",cls:"teal"},{label:"Vẫn nộp",cls:"ghost"}]);if(r.i===0)return}
      else if((Date.now()-t0)/1000<set.questions.length*12){session.rushed++;const r=await modal(`<h3>Nộp nhanh vậy sao?</h3><p>Con làm ${set.questions.length} câu trong chưa đến ${Math.ceil((Date.now()-t0)/1000)} giây. Đọc lại từng câu một lần nữa nhé.</p>`,[{label:"Đọc lại",cls:"teal"},{label:"Con chắc chắn",cls:"ghost"}]);if(r.i===0){say("Good choice. Careful students score higher.");return}}
    }
    try{speechSynthesis.cancel()}catch(e){}
    session.countdown=null;session.onTimeUp=null;
    let correct=0;
    const review=set.questions.map((q,i)=>{const ok=isRight(q,answers[i]);if(ok)correct++;const ans=q.type==="gap"?q.answer[0]:q.answer;return `<div class="review ${ok?"ok":"no"}"><b>${i+1}. ${ok?"✓":"✗"}</b> ${esc(q.q)}<br>Con chọn: <b>${esc(answers[i]||"(bỏ trống)")}</b>${ok?"":` · Đáp án: <b>${esc(ans)}</b>`}${q.explain?`<br><span class="muted">${esc(q.explain)}</span>`:""}</div>`}).join("");
    const res={correct,total:set.questions.length,review};
    if(mock){opts.onDone(res);return}
    main.innerHTML=`${sessionHead("Xem lại bài")}<div class="panel"><p><b>${correct}/${res.total}</b> câu đúng. Đọc phần giải thích của các câu sai trước khi xem điểm.</p>${review}${skill==="listening"?`<details><summary>Xem lời thoại</summary>${set.lines.map(l=>`<p><b>${esc(l.speaker)}:</b> ${esc(l.text)}</p>`).join("")}</details>`:""}<div class="row" style="margin-top:10px"><button class="btn teal" id="fin" disabled>Đọc giải thích… 8</button></div></div>`;
    bindQuit();scrollTo(0,0);
    let c=8;const fb=$("#fin");const iv=setInterval(()=>{c--;if(!document.body.contains(fb)){clearInterval(iv);return}if(c<=0){clearInterval(iv);fb.disabled=false;fb.textContent="Xem điểm"}else fb.textContent=`Đọc giải thích… ${c}`},1000);
    fb.onclick=()=>opts.onDone(res);
  };
  $("#submit").onclick=()=>grade(false);
}

/* ============ Writing ============ */
async function gradeWriting(t,text){
  const sample=await getSample();if(!sample)return null;
  const wc=wordCount(text);
  const prompt=`You are a strict, experienced IELTS Writing examiner. Grade this Academic Writing Task ${t.task} response using the public IELTS band descriptors (${t.task===1?"Task Achievement":"Task Response"}, Coherence and Cohesion, Lexical Resource, Grammatical Range and Accuracy). Be realistic and do not inflate scores. Word count: ${wc} (minimum ${t.min}; apply the usual penalty if under length or off-topic).
Task: """${t.prompt}${t.table?"\nTable: "+t.table.map(r=>r.join(" | ")).join(" / "):""}"""
Response: """${text.slice(0,6000)}"""
Return ONLY JSON, no markdown: {"band":number (overall, nearest 0.5),"criteria":{"TR":number,"CC":number,"LR":number,"GRA":number},"strengths":[2 short points in Vietnamese],"fixes":[3 concrete, actionable points in Vietnamese, quoting the student's own words where useful],"better":"one weak sentence from the response rewritten at band 7+, in English","encourage":"one warm, short sentence in English to the student"}`;
  try{const r=await sample.json(prompt,{modelTier:"default"});if(typeof r.band!=="number")return null;r.band=roundBand(r.band);return r}catch(e){aiFail(e);return null}
}
function wordCount(t){return (t.trim().match(/[A-Za-z0-9’'-]+/g)||[]).length}
function startWriting(opts={}){
  const n=S.sessions.filter(s=>s.type==="writing").length;
  const t=opts.task||WRITING_TASKS[n%WRITING_TASKS.length];
  if(!opts.mock){beginSession("writing");say(t.task===2?"Plan for five minutes first: your opinion, two main ideas, and examples.":"Start with an overview of the main trends, then compare the numbers.")}
  main.innerHTML=`${sessionHead(`Writing Task ${t.task}`,opts.timeLimit?`<span class="pill timer" id="countdown">${fmtTime(opts.timeLimit)}</span>`:"")}
  <div class="panel"><p><b>Đề bài</b> · gợi ý ${t.mins} phút · tối thiểu ${t.min} từ</p><p>${esc(t.prompt)}</p>${t.table?`<div class="scroll"><table class="t">${t.table.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`:""}</div>
  ${!opts.mock&&levelBand()<5.5&&t.task===2?`<details class="panel"><summary>Dàn ý gợi ý (bấm để mở)</summary><ol class="small"><li><b>Mở bài (2 câu):</b> viết lại đề bằng từ của con, nêu rõ quan điểm.</li><li><b>Thân bài 1:</b> ý chính → giải thích vì sao → ví dụ cụ thể.</li><li><b>Thân bài 2:</b> ý chính thứ hai hoặc quan điểm ngược lại → giải thích → ví dụ.</li><li><b>Kết bài (1–2 câu):</b> nhắc lại quan điểm, không thêm ý mới.</li></ol></details>`:""}
  <textarea id="essay" placeholder="Viết bài ở đây…" spellcheck="false"></textarea>
  <div class="row" style="justify-content:space-between;margin-top:8px"><span class="pill" id="wc">0 từ</span><button class="btn" id="sendW">Nộp cho cô chấm</button></div>`;
  bindQuit();
  const ta=$("#essay");const wcEl=$("#wc");ta.oninput=()=>{const c=wordCount(ta.value);wcEl.textContent=`${c} từ`;wcEl.style.background=c>=t.min?"var(--good-bg)":""};
  ta.onpaste=e=>{e.preventDefault();toast("Bài viết cần tự gõ, không dán từ nơi khác.")};
  const submit=async force=>{
    const text=ta.value,wc=wordCount(text);
    if(!force&&wc<t.min){const r=await modal(`<h3>Mới có ${wc} từ</h3><p>Bài dưới ${t.min} từ sẽ bị trừ điểm khi thi thật. Viết thêm nhé?</p>`,[{label:"Viết thêm",cls:"teal"},{label:"Vẫn nộp",cls:"ghost"}]);if(r.i===0)return}
    if(session){session.countdown=null;session.onTimeUp=null}
    loading("Cô đang chấm bài");
    const g=wc>=20?await gradeWriting(t,text):null;
    const res={task:t,text,wc,grade:g};
    if(opts.onDone)return opts.onDone(res);
    finishWritingPractice(res);
  };
  $("#sendW").onclick=()=>submit(false);
  if(opts.timeLimit){session.countdown=opts.timeLimit;session.onTimeUp=()=>{say("Time is up.");submit(true)}}
}
function feedbackHTML(g,keys){if(!g)return `<p class="muted">Chưa chấm được bằng AI lúc này. Bài đã được lưu để bố mẹ xem lại.</p>`;return `<div class="crit">${keys.map(k=>`<div><b>${g.criteria?.[k]??"–"}</b><span class="small muted">${k}</span></div>`).join("")}</div><p><b>Điểm mạnh</b></p><ul>${(g.strengths||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ul><p><b>Cần sửa</b></p><ul>${(g.fixes||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ul>${g.better?`<p><b>Câu viết lại hay hơn</b><br><i>${esc(g.better)}</i></p>`:""}`}
function finishWritingPractice(res){
  const g=res.grade;const score=g?g.band/9*10:null;
  const rec=endSession(score,{band:g?g.band:null,task:res.task.task,prompt:res.task.prompt,wc:res.wc,text:res.text.slice(0,4000),fixes:g?g.fixes:[],criteria:g?g.criteria:null});
  showResult(rec,g?`Band ước tính ${g.band} · ${res.wc} từ`:`${res.wc} từ`,feedbackHTML(g,["TR","CC","LR","GRA"]),g?.encourage);
}

/* ============ Speaking ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
async function gradeSpeaking(items){
  const sample=await getSample();if(!sample)return null;
  const prompt=`You are an experienced IELTS Speaking examiner. Below are a candidate's answers, given as speech-to-text transcripts or typed text. Grade them with the public IELTS Speaking band descriptors: Fluency and Coherence (FC), Lexical Resource (LR), Grammatical Range and Accuracy (GRA), and Pronunciation (P — estimate cautiously from the transcript only; say so). Be realistic, do not inflate; very short answers cannot score above 5.
${items.map((x,i)=>`Q${i+1} (${x.part}): ${x.q}\nA${i+1}: ${x.a||"(no answer)"}`).join("\n\n")}
Return ONLY JSON, no markdown: {"band":number (nearest 0.5),"criteria":{"FC":number,"LR":number,"GRA":number,"P":number},"strengths":[2 short points in Vietnamese],"fixes":[3 concrete points in Vietnamese, with an improved example phrase in English for each],"better":"a band-7 sample answer to the weakest question, 3-4 sentences, English","encourage":"one warm, short sentence in English"}`;
  try{const r=await sample.json(prompt,{modelTier:"default"});if(typeof r.band!=="number")return null;r.band=roundBand(r.band);return r}catch(e){aiFail(e);return null}
}
function startSpeaking(opts={}){
  const full=!!opts.full;
  const items=opts.items?clone(opts.items):[];
  if(!opts.items){
  shuffle(SPEAKING.p1).slice(0,full?4:2).forEach(q=>items.push({part:"Part 1",q}));
  items.push({part:"Part 2",q:pick(SPEAKING.p2),cue:true});
  shuffle(SPEAKING.p3).slice(0,full?3:1).forEach(q=>items.push({part:"Part 3",q}));
  }
  if(!opts.mock)beginSession("speaking");
  let rec=null;
  const step=i=>{
    if(rec){try{rec.stop()}catch(e){}rec=null}
    if(i>=items.length)return done();
    const it=items[i];
    main.innerHTML=`${sessionHead("Speaking")}<div class="progress"><i style="width:${i/items.length*100}%"></i></div><p class="muted small">${esc(it.part)} · Câu ${i+1}/${items.length}</p>
    <div class="panel"><p style="font-size:1.1rem;font-weight:600">${esc(it.q)}</p>${it.cue?`<p class="muted small">Part 2: chuẩn bị 1 phút, sau đó nói 1–2 phút. <span class="pill" id="p2t">Chuẩn bị 01:00</span></p>`:`<p class="muted small">Trả lời 2–4 câu, có lý do và ví dụ.</p>`}
    <div class="row"><button class="btn ghost small" id="rep">🔊 Nghe lại câu hỏi</button>${SR?`<button class="btn small mic" id="mic">🎙️ Bắt đầu nói</button>`:""}</div></div>
    <label class="f" for="sa">${SR?"Lời con nói sẽ hiện ở đây (có thể sửa hoặc gõ thêm)":"Gõ câu trả lời của con (thiết bị không hỗ trợ ghi âm)"}</label><textarea id="sa" style="min-height:150px"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn teal" id="nx">${i===items.length-1?"Nộp cho cô chấm":"Câu tiếp"}</button></div>`;
    bindQuit();
    speak(it.q);$("#rep").onclick=()=>speak(it.q);
    const ta=$("#sa");
    if(it.cue){let p=60;const el=$("#p2t");const iv=setInterval(()=>{if(!document.body.contains(el)){clearInterval(iv);return}p--;if(p>0)el.textContent="Chuẩn bị "+fmtTime(p);else if(p===0){el.textContent="Bắt đầu nói!";say("Okay, please start speaking now.")}else{el.textContent="Đang nói "+fmtTime(-p);if(p===-120){el.textContent="Hết 2 phút";clearInterval(iv)}}},1000)}
    if(SR){const mb=$("#mic");mb.onclick=()=>{
      if(rec){try{rec.stop()}catch(e){}return}
      try{rec=new SR();rec.lang="en-GB";rec.continuous=true;rec.interimResults=true;const base=ta.value?ta.value+" ":"";
        rec.onresult=e=>{let t="";for(let k=0;k<e.results.length;k++)t+=e.results[k][0].transcript;ta.value=base+t;lastAct=Date.now()};
        rec.onend=()=>{mb.classList.remove("on");mb.textContent="🎙️ Nói tiếp";rec=null;if(session)session.listening=false};
        rec.onerror=ev=>{if(ev.error==="not-allowed"||ev.error==="service-not-allowed")toast("Micro bị chặn trong trang này. Con gõ câu trả lời nhé.")};
        rec.start();mb.classList.add("on");mb.textContent="⏹ Dừng";if(session)session.listening=true;
      }catch(e){toast("Không bật được micro. Con gõ câu trả lời nhé.")}
    }}
    $("#nx").onclick=async()=>{const a=ta.value.trim();if(a.split(/\s+/).length<8){const r=await modal(`<h3>Câu trả lời hơi ngắn</h3><p>Giám khảo cần nghe con nói đủ ý: trả lời, lý do, ví dụ. Nói thêm nhé?</p>`,[{label:"Nói thêm",cls:"teal"},{label:"Tiếp",cls:"ghost"}]);if(r.i===0)return}it.a=a;step(i+1)};
  };
  const done=async()=>{
    loading("Cô đang nghe lại và chấm điểm");
    const g=await gradeSpeaking(items);
    const res={items,grade:g};
    if(opts.onDone)return opts.onDone(res);
    const rec2=endSession(g?g.band/9*10:null,{band:g?g.band:null,answers:items.map(x=>({q:x.q,a:(x.a||"").slice(0,800)})),fixes:g?g.fixes:[],criteria:g?g.criteria:null});
    showResult(rec2,g?`Band ước tính ${g.band}`:"Đã lưu câu trả lời",feedbackHTML(g,["FC","LR","GRA","P"])+(g?`<p class="muted small">Điểm phát âm (P) chỉ là ước tính từ chữ, không thay được giám khảo thật.</p>`:""),g?.encourage);
  };
  if(!opts.mock)say("Speak naturally. Give a reason and an example for each answer.");
  step(0);
}

/* ============ Results ============ */
function showResult(rec,line,extraHTML="",encourage){
  const score=rec.score;
  const good=score!=null&&score>=8,low=score!=null&&score<5;
  if(good)say((encourage||pick(PRAISE))+" You earned a sticker!",pick(PRAISE_VI),false,"happy");
  else if(low)say(encourage||"Let's look at the mistakes together.",FIRM.low,true);
  else if(score!=null)say(encourage||pick(NUDGE),pick(NUDGE_VI),false,"thinking");
  if(rec.justCompletedDay)setTimeout(()=>say(`That's ${S.settings.dailyMin} minutes today. Mission complete!`,"Con đã hoàn thành nhiệm vụ hôm nay. Giỏi lắm!"),4500);
  main.innerHTML=`<div class="panel result">${good?`<div class="sticker-pop">${STICKERS[(S.stickers.earned-1)%STICKERS.length]}</div><p><b>+${rec.stickers} sticker</b> (${vnd(S.settings.stickerValue*rec.stickers)})</p>`:""}
  <div class="big">${score!=null?score:"—"}<span style="font-size:1.4rem">/10</span></div><p>${esc(line)}</p><p class="muted small">Thời gian học: ${fmtTime(rec.secs)}${rec.rushed?` · ${rec.rushed} lần làm quá vội`:""}</p>
  ${!good&&score!=null?`<p class="small">Đạt từ 8/10 trở lên để nhận sticker.</p>`:""}</div>
  ${extraHTML?`<div class="panel">${extraHTML}</div>`:""}
  ${rec.justCompletedDay&&S.settings.email?`<div class="banner ok">Xong ${S.settings.dailyMin} phút hôm nay! <a class="btn small teal" href="${mailtoDaily()}" target="_blank" rel="noopener">Gửi báo cáo cho bố mẹ</a></div>`:""}
  ${surveyHTML()}<div class="row"><button class="btn teal" id="home" disabled>Trả lời khảo sát để tiếp tục</button></div>`;
  bindSurvey(rec);scrollTo(0,0);
}

/* ============ Mock test ============ */
function renderMockSetup(){
  const pend=pendingSurveyRec();if(pend){renderPendingSurvey(pend);return}
  const last=S.sessions.filter(s=>s.type==="mock"&&s.details&&s.details.bands).slice(-1)[0];
  main.innerHTML=`<h2>Phòng thi thử</h2><p class="muted">Đề do AI soạn mới mỗi lần theo dạng IELTS Academic gần đây, chấm và quy đổi band. Mỗi kỹ năng đạt từ 6.5 nhận 1 sticker.</p>
  ${last?`<div class="banner ok">Lần gần nhất (${last.date}): ${Object.entries(last.details.bands).map(([k,v])=>`${SKILL_NAME[k]} ${v}`).join(", ")}${last.details.overall?` · Overall ${last.details.overall}`:""}</div>`:""}
  <div class="panel"><p><b>Chọn kỹ năng</b> (theo thứ tự thi thật)</p>
  ${["listening","reading","writing","speaking"].map(k=>`<label class="opt"><input type="checkbox" name="sk" value="${k}" checked><span>${SKILL_NAME[k]}</span></label>`).join("")}
  <p style="margin-top:12px"><b>Độ dài</b></p>
  <label class="opt"><input type="radio" name="len" value="short" checked><span>Rút gọn (~60 phút): Nghe 1 phần, Đọc 1 bài, Viết Task 2, Nói 3 phần ngắn</span></label>
  <label class="opt"><input type="radio" name="len" value="full"><span>Dài (~2 giờ): Nghe 2 phần, Đọc 2 bài, Viết Task 1 + Task 2, Nói đầy đủ</span></label>
  <div class="row" style="margin-top:12px"><button class="btn" id="go">Vào phòng thi</button></div></div>
  <p class="muted small">Lưu ý: đề thật có Nghe 4 phần, Đọc 3 bài. Bản dài ở đây là một nửa đề để vừa sức một buổi.</p>`;
  $("#go").onclick=async()=>{
    const skills=[...main.querySelectorAll('input[name=sk]:checked')].map(x=>x.value);
    if(!skills.length){toast("Chọn ít nhất một kỹ năng.");return}
    const full=main.querySelector('input[name=len]:checked').value==="full";
    if(!(await getSample()))toast("AI chưa sẵn sàng: Nghe/Đọc dùng đề có sẵn, Viết/Nói sẽ chưa chấm được.");
    runMock(skills,full);
  };
}
async function runMock(skills,full){
  beginSession("mock");say("Welcome to the exam room. Read every instruction carefully. Good luck!");
  const bands={},notes={};
  for(const sk of skills){
    if(!session)return;
    if(sk==="listening"||sk==="reading"){
      const parts=full?2:1;let c=0,t=0;
      for(let p=0;p<parts;p++){
        if(!session)return;
        loading(`Đang chuẩn bị ${SKILL_NAME[sk]} phần ${p+1}`);
        let set=sk==="reading"?await genReading(full?13:10,true):await genListening(10,full?p+1:pick([1,2]),true);
        if(!set)set=clone(sk==="reading"?READING_SET:LISTENING_SET);
        if(!session)return;
        const r=await new Promise(res=>runQuizSet(set,sk,{mock:true,timeLimit:sk==="reading"?20*60:10*60,partLabel:`${SKILL_NAME[sk]} · phần ${p+1}/${parts}`,onDone:res}));
        c+=r.correct;t+=r.total;
      }
      bands[sk]=rawToBand(c/t*40);notes[sk]=`${c}/${t}`;
    }
    if(sk==="writing"){
      const tasks=full?[WRITING_TASKS.find(x=>x.task===1),pick(WRITING_TASKS.filter(x=>x.task===2))]:[pick(WRITING_TASKS.filter(x=>x.task===2))];
      const got=[];
      for(const t of tasks){if(!session)return;const r=await new Promise(res=>startWriting({mock:true,task:t,timeLimit:t.mins*60,onDone:res}));got.push(r)}
      const g1=got.find(x=>x.task.task===1),g2=got.find(x=>x.task.task===2);
      if(g2&&g2.grade){bands.writing=g1&&g1.grade?roundBand((g1.grade.band+2*g2.grade.band)/3):g2.grade.band}
      notes.writing=got.map(x=>`Task ${x.task.task}: ${x.wc} từ${x.grade?`, band ${x.grade.band}`:""}`).join("; ");
      notes.writingFix=got.flatMap(x=>x.grade?x.grade.fixes||[]:[]);
    }
    if(sk==="speaking"){
      if(!session)return;
      const r=await new Promise(res=>startSpeaking({mock:true,full,onDone:res}));
      if(r.grade)bands.speaking=r.grade.band;notes.speakingFix=r.grade?r.grade.fixes||[]:[];
    }
  }
  const vals=Object.values(bands);const overall=vals.length===4?roundBand(vals.reduce((a,b)=>a+b,0)/4):null;
  const rec=endSession(vals.length?Math.max(...vals)/9*10:null,{bands,overall,notes,full});
  const reached=vals.filter(b=>b>=6.5).length;
  if(reached)say(`Well done! ${reached} skill${reached>1?"s":""} at 6.5 or above.`);else say("This is a practice test. Now we know exactly what to work on.","Chưa đạt 6.5 cũng không sao, nhưng con cần ôn đều mỗi ngày.",true);
  main.innerHTML=`<div class="panel result"><h2>Kết quả thi thử</h2>${overall!=null?`<div class="big">${overall}</div><p>Overall band</p>`:""}
  <div class="crit">${["listening","reading","writing","speaking"].map(k=>`<div><b>${bands[k]??"–"}</b><span class="small muted">${SKILL_NAME[k]}</span></div>`).join("")}</div>
  <p class="small muted">Nghe ${notes.listening||"–"} · Đọc ${notes.reading||"–"}</p>
  ${reached?`<div class="sticker-pop">${STICKERS[(S.stickers.earned-1)%STICKERS.length]}</div><p><b>+${reached} sticker</b> cho kỹ năng đạt từ 6.5</p>`:`<p>Mục tiêu: mỗi kỹ năng từ 6.5.</p>`}</div>
  ${(notes.writingFix||[]).length||(notes.speakingFix||[]).length?`<div class="panel"><h3>Cô dặn</h3><ul>${[...(notes.writingFix||[]),...(notes.speakingFix||[])].slice(0,6).map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`:""}
  ${surveyHTML()}<div class="row"><button class="btn teal" id="home" disabled>Trả lời khảo sát để tiếp tục</button></div>`;
  bindSurvey(rec);scrollTo(0,0);
}


/* ============ Level & study plan ============ */
function daysBetween(a,b){const p=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)}
function fmtDate(k){const[y,m,d]=k.split("-");return `${+d}/${+m}/${y}`}
function levelBand(){return S.level?S.level.overall:(S.settings.centerScore||5)}
function startBand(){return Math.min(6.5,S.settings.centerScore||(S.level&&S.level.overall)||4.5)}
function planInfo(){
  const start=S.settings.planStart||S.firstDay||dayKey(),end=S.settings.targetDate||"2028-05-31";
  const totalW=Math.max(12,Math.round(daysBetween(start,end)/7));
  const week=Math.min(totalW,Math.max(1,Math.floor(daysBetween(start,dayKey())/7)+1));
  const fr=[.2,.45,.75,1],ends=fr.map(f=>Math.round(totalW*f)),sb=startBand();
  const phases=PHASES.map((p,i)=>({...p,from:i?ends[i-1]+1:1,to:ends[i],target:roundBand(sb+(6.5-sb)*(i+1)/4)}));
  const phase=phases.find(p=>week>=p.from&&week<=p.to)||phases[3];
  return {start,end,totalW,week,phases,phase,focus:CYCLE[(week-1)%12]};
}
function weekStart(start,w){return addDays(start,(w-1)*7)}
function aiLevel(mock){if(mock)return "authentic IELTS Academic level (mixed band 5.0-7.5)";const t=planInfo().phase.target+surveyAdj();return `band ${Math.max(4,t-0.5).toFixed(1)}-${(t+0.5).toFixed(1)}`}

  <div class="phases">${P.phases.map((p,i)=>`<div class="${i<pi?"past":i===pi?"cur":""}" style="--w:${p.to-p.from+1}">${esc(p.name)}<br>→ ${p.target}</div>`).join("")}</div>
  ${!lv?`<div class="banner">Con chưa làm test đầu vào trong app. <button class="btn small teal" id="placeBtn2" style="margin-left:6px">Làm test (~30 phút)</button></div>`:""}
  <div class="panel wk now"><h3>Tuần ${P.week}: ${esc(f.focus)}</h3><p class="small muted">Chủ đề: ${esc(f.topic)} · Giai đoạn ${pi+1} “${esc(ph.name)}”, mục tiêu band ${ph.target} vào cuối giai đoạn (${fmtDate(addDays(weekStart(P.start,ph.to),6))}).</p>
  <div class="scroll"><table class="t"><tr><th>Đọc</th><td>${esc(f.r)}</td></tr><tr><th>Nghe</th><td>${esc(f.l)}</td></tr><tr><th>Viết</th><td>${esc(f.w)}</td></tr><tr><th>Nói</th><td>${esc(f.s)}</td></tr><tr><th>Ngữ pháp</th><td>${esc(f.g)}</td></tr></table></div>
  <p style="margin:12px 0 4px"><b>Sách tuần này</b></p><ul class="small">${ph.books.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>
  <label class="opt"><input type="checkbox" data-bk="${P.week}" ${S.bookDone[P.week]?"checked":""}><span>Đã làm phần sách của tuần ${P.week}</span></label>
  <p class="small muted" style="margin-top:8px">Trong app: khi bấm “Đề mới (AI)”, đề Đọc và Nghe tuần này được soạn theo chủ đề trên, độ khó ${aiLevel(false).replace("band ","band ")}.</p></div>

  <p class="small"><b>Lưu ý:</b> app không phải sản phẩm chính thức và không được ba đơn vị trên chứng nhận. Điểm trong app là ước tính để theo dõi tiến bộ; điểm chính thức chỉ có khi con thi thật.</p></div>`;
  main.querySelectorAll("[data-bk]").forEach(c=>c.onchange=()=>{S.bookDone[c.dataset.bk]=c.checked;save();main.querySelectorAll(`[data-bk="${c.dataset.bk}"]`).forEach(x=>x.checked=c.checked)});
  const pb=$("#placeBtn2");if(pb)pb.onclick=startPlacement;

async function startPlacement(){
  const r=await modal(`<h3>Test đầu vào (~30 phút)</h3><p>5 phần: Ngữ pháp & từ vựng, Đọc, Nghe (chỉ nghe 1 lần), Viết, Nói. Làm một mạch, không tra từ điển.</p><p class="muted small">Kết quả dùng để chỉnh độ khó, lượng từ mới và lộ trình. Phần Viết và Nói do AI chấm.</p>`,[{label:"Bắt đầu",cls:"teal"},{label:"Để sau",cls:"ghost"}]);
  if(r.i!==0)return;
  beginSession("placement");
  say("This test helps me choose the right lessons for you. Do your best, and read carefully.","Con làm cẩn thận, không cần vội nhé.");
  const run=(set,skill,t,label)=>new Promise(res=>runQuizSet(clone(set),skill,{mock:true,timeLimit:t,partLabel:label,onDone:res}));
  const g=await run(PLACEMENT.grammar,"grammar",10*60,"Phần 1/5 · chọn đáp án đúng");if(!session)return;
  const rd=await run(PLACEMENT.reading,"reading",10*60,"Phần 2/5");if(!session)return;
  const ls=await run(PLACEMENT.listening,"listening",6*60,"Phần 3/5 · đọc câu hỏi trước rồi bấm nghe");if(!session)return;
  const w=await new Promise(res=>startWriting({mock:true,task:PLACEMENT.writing,timeLimit:15*60,onDone:res}));if(!session)return;
  const sp=await new Promise(res=>startSpeaking({mock:true,items:PLACEMENT.speaking,onDone:res}));if(!session)return;
  const ci=g.correct<=4?0:g.correct<=8?1:g.correct<=11?2:g.correct<=13?3:4;
  const CEFR=["A2","B1","B2","B2+","C1"],gBand=[3.5,4.5,5.5,6,6.5][ci];
  const bands={listening:[3.5,4,4.5,5,5.5,6.5][ls.correct]??4,reading:[3.5,4,4.5,5,5.5,6,7][rd.correct]??4,writing:w.grade?w.grade.band:Math.min(gBand,5),speaking:sp.grade?sp.grade.band:gBand};
  const overall=roundBand((bands.listening+bands.reading+bands.writing+bands.speaking)/4);
  const lv={overall,bands,cefr:CEFR[ci],grammar:`${g.correct}/${g.total}`,date:dayKey(),ai:!!(w.grade&&sp.grade)};
  if(S.level)S.levelHistory=(S.levelHistory||[]).concat([S.level]);
  S.level=lv;if(!S.settings.planStart)S.settings.planStart=dayKey();
  endSession(null,{bands,overall,cefr:lv.cefr,grammar:lv.grammar,fixes:[...((w.grade&&w.grade.fixes)||[]),...((sp.grade&&sp.grade.fixes)||[])].slice(0,6)});
  const cs=S.settings.centerScore,gap=cs!=null?Math.abs(overall-cs):0;
  say(`Thank you! Your level today is about band ${overall}. Now I know exactly where to start.`);
  main.innerHTML=`<div class="panel result"><h2>Kết quả test đầu vào</h2><div class="big">${overall}</div><p>Band ước tính · trình độ ngữ pháp/từ vựng ${lv.cefr} (${lv.grammar})</p>
  <div class="crit">${["listening","reading","writing","speaking"].map(k=>`<div><b>${bands[k]}</b><span class="small muted">${SKILL_NAME[k]}</span></div>`).join("")}</div>
  ${!lv.ai?`<p class="small muted">Viết/Nói chưa được AI chấm nên ước tính từ phần ngữ pháp.</p>`:""}
  ${cs!=null?`<p class="small">Trung tâm: ${cs}. ${gap>=1?"Chênh khá nhiều; bài test này ngắn nên chỉ là ước tính sơ bộ. Bố mẹ có thể tin điểm trung tâm hơn và cho con test lại sau 2 tuần.":"Khá sát với kết quả ở trung tâm."}</p>`:""}
  <p class="small">Mục tiêu 6.5 overall trước ${fmtDate(S.settings.targetDate)}.</p></div>
  <div class="row"><button class="btn teal" id="toPlan">Xem lộ trình</button><button class="btn ghost" id="home">Về trang học</button></div>`;
  $("#toPlan").onclick=()=>{tab="plan";render();scrollTo(0,0)};$("#home").onclick=()=>{tab="home";render();scrollTo(0,0)};scrollTo(0,0);
}

function stickerBalance(){return S.stickers.earned-S.stickers.spent}
function renderStickers(){
  const bal=stickerBalance(),free=bal-pendingCost(),val=S.settings.stickerValue,slots=Math.max(24,Math.ceil(S.stickers.earned/12)*12);

  <label class="f" for="rt">Loại phần thưởng</label>
  <select id="rt"><option value="cash">Tiền: ${vnd(val)} / sticker</option><option value="dayoff">1 ngày nghỉ học: ${S.settings.dayOffCost} sticker</option><option value="gift">Món quà tự chọn</option></select>
  <div id="rx"></div>
  <div class="row" style="margin-top:12px"><button class="btn" id="req">Gửi yêu cầu đổi</button></div></div>
  ${S.redemptions.length?`<div class="panel"><h3>Lịch sử đổi</h3><div class="scroll"><table class="t"><tr><th>Ngày</th><th>Phần thưởng</th><th>Sticker</th><th>Trạng thái</th></tr>${S.redemptions.slice().reverse().slice(0,15).map(r=>`<tr><td>${r.date}</td><td>${esc(r.label)}</td><td>${r.cost}</td><td>${{pending:"Chờ duyệt",approved:"Đã duyệt",rejected:"Từ chối"}[r.status]}</td></tr>`).join("")}</table></div></div>`:""}`;
  const rx=$("#rx"),rt=$("#rt");
  const upd=()=>{const v=rt.value;rx.innerHTML=v==="cash"?`<label class="f" for="rn">Số sticker đổi</label><input type="number" id="rn" min="1" max="${free}" value="${Math.min(1,free)}">`:v==="dayoff"?`<label class="f" for="rd">Ngày muốn nghỉ</label><input type="date" id="rd" min="${dayKey()}" value="${addDays(dayKey(),1)}">`:`<label class="f" for="rg">Tên món quà</label><input type="text" id="rg" placeholder="Ví dụ: quyển truyện tranh"><label class="f" for="rn">Số sticker (giá trị tương đương)</label><input type="number" id="rn" min="1" value="3">`};
  rt.onchange=upd;upd();
  $("#req").onclick=()=>{
    const v=rt.value;let cost,label;
    if(v==="cash"){cost=parseInt($("#rn").value)||0;label=`Tiền ${vnd(cost*val)}`}
    else if(v==="dayoff"){cost=S.settings.dayOffCost;const d=$("#rd").value;if(!d){toast("Chọn ngày nghỉ.");return}label=`1 ngày nghỉ (${d})`}
    else{cost=parseInt($("#rn").value)||0;const g=$("#rg").value.trim();if(!g){toast("Ghi tên món quà.");return}label=`Quà: ${g} (~${vnd(cost*val)})`}

    if(cost>free){say("Not enough stickers yet. Keep going!","Con chưa đủ sticker. Cố thêm nhé!");return}
    S.redemptions.push({id:Date.now().toString(36),type:v,label,cost,status:"pending",date:dayKey(),dayoff:v==="dayoff"?$("#rd").value:null});save();
    say("Request sent to your parents. Fingers crossed!");renderStickers();
  };
}

function fmtAvg(a){return a&&a.n?`${(a.sum/a.n).toFixed(1)}/10 (${a.n} buổi)`:"–"}
function detailHTML(s){const d=s.details||{};let h="";
  if(s.rushed)h+=`<p class="small">Làm vội: ${s.rushed} lần</p>`;
  if(d.correct!=null)h+=`<p class="small">Đúng ${d.correct}/${d.total}${d.title?` · ${esc(d.title)}`:""}</p>`;
  if(d.words)h+=`<p class="small">Từ đã học: ${esc(d.words.join(", "))}</p>`;
  if(d.prompt)h+=`<p class="small"><b>Đề:</b> ${esc(d.prompt)}</p>`;
  if(d.text)h+=`<p class="small" style="white-space:pre-wrap;border-left:3px solid var(--line);padding-left:10px">${esc(d.text)}</p>`;
  if(d.answers)h+=d.answers.map(a=>`<p class="small"><b>${esc(a.q)}</b><br>${esc(a.a||"(không trả lời)")}</p>`).join("");
  if(d.fixes&&d.fixes.length)h+=`<p class="small"><b>Cô góp ý:</b></p><ul class="small">${d.fixes.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`;
  if(d.bands)h+=`<p class="small">${Object.entries(d.bands).map(([k,v])=>`${SKILL_NAME[k]} ${v}`).join(", ")}${d.overall?` · Overall ${d.overall}`:""}</p>`;
  if(s.survey){const v=s.survey;h+=`<p class="small"><b>Khảo sát:</b> ${esc(v.diff)} · ${esc(v.mood)} · ${esc(v.focus)}${v.hard&&v.hard.length?" · khó: "+esc(v.hard.join(", ")):""}${v.why&&v.why.length?" · sai do: "+esc(v.why.join(", ")):""}${v.note?" · “"+esc(v.note)+"”":""}</p>`}
  return h||`<p class="small muted">Không có chi tiết.</p>`}
function weekStats(endKey){
  const days=[];for(let i=6;i>=0;i--){const k=addDays(endKey,-i);const ss=S.sessions.filter(s=>s.date===k);const sc=ss.filter(s=>s.score!=null);days.push({k,min:dayMinutes(k),n:ss.length,avg:sc.length?sc.reduce((a,s)=>a+s.score,0)/sc.length:null,off:S.dayOffs.includes(k)})}
  const keys=new Set(days.map(d=>d.k));const ss=S.sessions.filter(s=>keys.has(s.date));
  const skills={};ss.forEach(s=>{if(s.score==null||s.type==="mock")return;skills[s.type]=skills[s.type]||{sum:0,n:0};skills[s.type].sum+=s.score;skills[s.type].n++});
  return {days,skills,totalMin:days.reduce((a,d)=>a+d.min,0),daysMet:days.filter(d=>d.min>=S.settings.dailyMin||d.off).length,stickers:ss.reduce((a,s)=>a+(s.stickers||0),0),rushed:ss.reduce((a,s)=>a+(s.rushed||0),0),abandoned:ss.filter(s=>s.status==="bỏ dở").length,mocks:ss.filter(s=>s.type==="mock"&&s.details&&s.details.bands).map(s=>s.details.bands),fixes:ss.flatMap(s=>(s.details&&s.details.fixes)||[]).slice(-8),sessions:ss.length,survey:surveyStats(ss),asks:(S.asks||[]).filter(a=>keys.has(a.date)).map(a=>a.q).slice(-10)};
}
function weekChart(days){
  const W=340,H=170,pl=28,pb=26,pt=10,goal=S.settings.dailyMin,max=Math.max(goal*1.5,...days.map(d=>d.min)),bw=(W-pl-8)/7,y=v=>pt+(H-pt-pb)*(1-v/max),dn=["CN","T2","T3","T4","T5","T6","T7"];
  const pts=days.map((d,i)=>d.avg==null?null:[pl+bw*i+bw/2,pt+(H-pt-pb)*(1-d.avg/10)]);
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px" role="img" aria-label="Biểu đồ số phút học và điểm trung bình 7 ngày">
  <line x1="${pl}" x2="${W-4}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--rose)" stroke-dasharray="4 4"/><text x="${W-6}" y="${y(goal)-4}" text-anchor="end" font-size="10" fill="var(--rose)">${goal} phút</text>
  ${days.map((d,i)=>{const x=pl+bw*i+6,h=Math.max(1,(H-pt-pb)-(y(d.min)-pt));const [yy,mm,dd]=d.k.split("-").map(Number);return `<rect x="${x}" y="${y(d.min)}" width="${bw-12}" height="${h}" rx="5" fill="${d.min>=goal||d.off?"var(--teal)":"var(--sun)"}"/><text x="${x+(bw-12)/2}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${dn[new Date(yy,mm-1,dd).getDay()]}</text><text x="${x+(bw-12)/2}" y="${y(d.min)-3}" text-anchor="middle" font-size="9" fill="var(--ink)">${Math.round(d.min)}</text>`}).join("")}
  ${pts.filter(Boolean).length>1?`<polyline fill="none" stroke="var(--lilac)" stroke-width="2.5" points="${pts.filter(Boolean).map(p=>p.join(",")).join(" ")}"/>`:""}${pts.filter(Boolean).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--lilac)"/>`).join("")}
  </svg></div><p class="muted small">Cột: số phút học mỗi ngày (xanh = đủ chỉ tiêu). Đường tím: điểm trung bình /10.</p>`;
}
async function analyzeWeek(ws,prev){
  const sample=await getSample();const out=$("#repOut");

Dữ liệu tuần này: ${JSON.stringify(strip(ws))}
Dữ liệu tuần trước: ${JSON.stringify(strip(prev))}

"Làm vội" = trả lời dưới 1.5 giây hoặc nộp bài quá nhanh.

3. Thói quen, tư duy và tâm lý học tập (tính kiên trì, cẩn thận, tự giác, cảm xúc — dựa trên số phút, lần làm vội, bài bỏ dở và khảo sát con tự chọn; nêu rõ yếu điểm con tự nhận và những điều con còn chưa hiểu qua các câu con hỏi)
4. Lời khuyên cho bố mẹ (3–4 việc cụ thể, ưu tiên khen đúng lúc và cách nói chuyện khi con viện lý do)
5. Mục tiêu tuần tới (2–3 mục đo được)`;
  try{

  }catch(e){out.textContent="";aiFail(e)}

let flushing=false;
async function flushOutbox(){const u=S.settings.webhookUrl;if(flushing||!u||!(S.outbox||[]).length||navigator.onLine===false)return;flushing=true;const items=S.outbox.slice(0,50);
  try{await fetch(u,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:S.settings.webhookToken||"",items})});const sent=new Set(items.map(x=>x.id+"|"+JSON.stringify(x.survey||null)));S.outbox=S.outbox.filter(x=>!sent.has(x.id+"|"+JSON.stringify(x.survey||null)));save()}catch(e){}
  flushing=false;if((S.outbox||[]).length&&items.length===50)setTimeout(flushOutbox,1000)}
addEventListener("online",flushOutbox);setTimeout(flushOutbox,2000);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
