<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS cho Zen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E6A65">
<meta name="author" content="Papa-Phí Mạnh Trường">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IELTS cho Zen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F6F1; --surface:#FFFFFF; --surface2:#E3EEE6; --ink:#17323A; --muted:#55696C;
  --teal:#0E6A65; --on-teal:#FFFFFF; --sun:#FFC23D; --on-sun:#17323A; --rose:#C93A55; --rose-bg:#FCE6EA;
  --lilac:#6A5FCB; --good:#1E7A44; --good-bg:#DDF2E4; --line:#C9D9CF; --skin:#F4C9A8; --skin2:#E3A882;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1C1F; --surface:#162A2E; --surface2:#1E363B; --ink:#E4EFEC; --muted:#9BB2B0;
    --teal:#4CBDB3; --on-teal:#0B1A1C; --sun:#FFCE5C; --on-sun:#17323A; --rose:#FF7F95; --rose-bg:#3A1F27;
    --lilac:#9E94F0; --good:#6FD39A; --good-bg:#16352A; --line:#2C464B; --skin:#E9BC99; --skin2:#C98E6A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1C1F; --surface:#162A2E; --surface2:#1E363B; --ink:#E4EFEC; --muted:#9BB2B0;
  --teal:#4CBDB3; --on-teal:#0B1A1C; --sun:#FFCE5C; --on-sun:#17323A; --rose:#FF7F95; --rose-bg:#3A1F27;
  --lilac:#9E94F0; --good:#6FD39A; --good-bg:#16352A; --line:#2C464B; --skin:#E9BC99; --skin2:#C98E6A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3{font-family:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;line-height:1.15;margin:0 0 .35em;font-weight:700}
h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0 0 .8em}
img,svg{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

/* Teacher header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--line)}
.teacher{display:flex;gap:10px;align-items:flex-end;max-width:780px;margin:0 auto;padding:10px 14px 8px}
.avatar{position:relative;width:84px;height:100px;flex:none}
.avatar canvas{position:absolute;inset:0;width:100%;height:100%;display:none}
.avatar.has3d canvas{display:block}
.avatar.has3d .robot2d{display:none}
.robot2d{width:100%;height:100%;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.bubble{flex:1;background:var(--surface);border:2px solid var(--ink);border-radius:20px 20px 20px 6px;padding:8px 12px;min-height:58px;font-size:.95rem;position:relative}
.bubble b.name{font-family:"Baloo 2",sans-serif;color:var(--lilac);font-size:.95rem;display:block;line-height:1.1}
.bubble .vi{display:block;color:var(--rose);font-weight:600;margin-top:2px}
.bubble.firm{border-color:var(--rose);background:var(--rose-bg)}
.statusbar{display:flex;gap:8px;align-items:center;max-width:780px;margin:0 auto;padding:0 14px 8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;background:var(--surface2)}
.pill.timer{background:var(--ink);color:var(--paper);font-variant-numeric:tabular-nums}
.pill.paused{background:var(--rose);color:#fff}
.iconbtn{border:0;background:var(--surface2);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.85rem;font-weight:600;margin-left:auto}

/* teacher animation */
.head{transform-origin:60px 112px;animation:sway 7s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.mouth{transform-box:fill-box;transform-origin:center}
.talking .mouth{animation:talk .2s ease-in-out infinite alternate}
.talking .head{animation:nod 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes nod{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(1.5deg) translateY(1px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@media (prefers-reduced-motion:reduce){.head,.eyes,.talking .mouth,.talking .head{animation:none}}

main{max-width:780px;margin:0 auto;padding:18px 16px 24px}
.credit{max-width:780px;margin:0 auto;padding:4px 16px calc(100px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.welcome .hello{font-family:"Baloo 2",sans-serif;font-size:1.45rem;font-weight:700;line-height:1.25;margin-bottom:6px}
.welcome h3{margin-top:14px}
.welcome ul{margin:4px 0 8px;padding-left:20px}
.welcome .en{border-top:2px dashed var(--line);margin-top:14px;padding-top:10px;color:var(--muted)}
.sq{margin:12px 0}.sqq{font-weight:600;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.chat{max-width:520px}
.chatlog{max-height:48vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{padding:8px 12px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--teal);color:var(--on-teal)}
.msg.a{align-self:flex-start;background:var(--surface2)}
.msg .say{border:0;background:none;cursor:pointer;margin-left:4px;font-size:1rem}
#askBtn{background:var(--sun);color:var(--on-sun)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:195px;border:0;background:none;padding:9px 4px 10px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button span{font-size:1.35rem;line-height:1}
.tabs button[aria-current="page"]{color:var(--teal)}
.tabs button[aria-current="page"] span{transform:translateY(-2px)}
.tabs.locked{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;border:2px solid var(--ink);background:var(--sun);color:var(--on-sun);border-radius:14px;padding:11px 18px;box-shadow:0 3px 0 var(--ink);cursor:pointer;text-decoration:none;min-height:46px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.teal{background:var(--teal);color:var(--on-teal)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn.danger{background:var(--rose);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.today{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.today .ring{flex:none}
.today h2{margin:0}
.banner{border:2px solid var(--rose);background:var(--rose-bg);border-radius:16px;padding:12px 14px;margin:0 0 16px;font-weight:600}
.banner.ok{border-color:var(--good);background:var(--good-bg);color:var(--ink)}

.modlist{display:grid;gap:10px}
.mod{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:2px solid var(--ink);background:var(--surface);border-radius:18px;padding:12px 14px;cursor:pointer}
.mod:active{transform:translateY(1px)}
.mod .ic{font-size:1.8rem;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--surface2)}
.mod .t{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.15rem;line-height:1.15}
.mod .s{color:var(--muted);font-size:.88rem}
.mod .sc{font-weight:700;font-size:.9rem;color:var(--teal);text-align:right}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.flash{text-align:center;padding:26px 16px}
.flash .word{font-family:"Baloo 2",sans-serif;font-size:2.6rem;font-weight:800;line-height:1;margin:6px 0 2px;letter-spacing:.01em}
.flash .vi{font-size:1.25rem;font-weight:700;color:var(--teal);margin:10px 0}
.flash .ex{font-style:italic;color:var(--muted);max-width:52ch;margin:0 auto 16px}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.progress i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}

.choices{display:grid;gap:8px;margin-top:12px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;font-weight:600}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--rose);background:var(--rose-bg)}
input[type=text],input[type=email],input[type=number],input[type=password],input[type=date],textarea,select{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
input:focus,textarea:focus{border-color:var(--teal);outline:none}
textarea{min-height:260px;line-height:1.6;resize:vertical}
label.f{display:block;font-weight:600;margin:10px 0 4px;font-size:.92rem}

.passage{max-height:46vh;overflow:auto;border:2px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);font-family:Georgia,"Times New Roman",serif;line-height:1.75;margin-bottom:14px}
.passage p{max-width:68ch}
.q{border:0;margin:0 0 14px;padding:0}
.q legend,.q .ql{font-weight:600;margin-bottom:6px;display:block}
.qn{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:.8rem;margin-right:6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:2px solid var(--line);border-radius:12px;margin:5px 0;cursor:pointer;background:var(--surface)}
.opt input{margin-top:5px}
.review{padding:10px 12px;border-radius:12px;margin:6px 0 12px;font-size:.92rem}
.review.ok{background:var(--good-bg)} .review.no{background:var(--rose-bg)}

.result{text-align:center;padding:22px 16px}
.result .big{font-family:"Baloo 2",sans-serif;font-size:4rem;font-weight:800;line-height:1;color:var(--teal)}
.sticker-pop{font-size:4rem;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}

.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;background:var(--surface2);border-radius:18px;padding:12px;margin-bottom:14px}
.slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;background:var(--surface);border:2px dashed var(--line)}
.slot.on{border:2px solid var(--ink);background:var(--sun);transform:rotate(var(--r,0deg))}
.slot.used{opacity:.35;filter:grayscale(1)}

table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.crit{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.crit div{background:var(--surface2);border-radius:12px;padding:8px;text-align:center}
.crit b{display:block;font-size:1.3rem;font-family:"Baloo 2",sans-serif}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-weight:600}
.report{white-space:pre-wrap;line-height:1.65}
.mic.on{background:var(--rose);color:#fff}
.phases{display:flex;gap:4px;margin:10px 0 16px}
.phases div{flex:var(--w) 1 0;min-width:0;background:var(--surface2);border-radius:10px;padding:6px 8px;font-size:.78rem;line-height:1.3}
.phases .past{background:var(--good-bg)}
.phases .cur{background:var(--teal);color:var(--on-teal);font-weight:700}
.wk.now{border-color:var(--teal)}
.wk table.t th{width:92px;color:var(--muted);font-weight:600}
.i{width:22px;height:22px;display:block}
.mod .ic{transition:transform .15s}
.mod .ic svg{width:28px;height:28px}
.mod:active .ic{transform:rotate(-6deg) scale(1.06)}
.ic.sm{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;flex:none}
.ic.sm svg{width:20px;height:20px}
.progress i{background:var(--skill,var(--teal))}
.tabs .ti{width:32px;height:28px;display:grid;place-items:center;border-radius:10px;transition:background .2s}
.tabs button[aria-current="page"] .ti{background:var(--teal);color:var(--on-teal);transform:none}
.iconbtn{display:inline-flex;align-items:center;gap:4px}
.iconbtn .i{width:16px;height:16px}
.iconbtn+.iconbtn{margin-left:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,22,.55);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:20px;max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:.9rem}
.loading{text-align:center;padding:40px 10px}
.dots::after{content:"…";animation:d 1.2s steps(3) infinite}
@keyframes d{0%{content:"."}33%{content:".."}66%{content:"..."}}
@media (min-width:640px){.avatar{width:104px;height:120px}.bubble{font-size:1rem}}
</style>
</head>
<body>
<div class="top">
  <div class="teacher">
    <div class="avatar" id="avatar"><canvas id="robot3d" aria-hidden="true"></canvas>
    <svg class="robot2d" viewBox="0 0 120 140" aria-hidden="true">
      <g class="head"><line x1="60" y1="22" x2="60" y2="9" stroke="#8D99A6" stroke-width="3"/><circle cx="60" cy="8" r="4.5" fill="#2EC4B6"/>
      <rect x="13" y="44" width="11" height="22" rx="5.5" fill="#8D99A6"/><rect x="96" y="44" width="11" height="22" rx="5.5" fill="#8D99A6"/>
      <rect x="21" y="20" width="78" height="72" rx="36" fill="#F3F5F7" stroke="#C9D3DC" stroke-width="2"/>
      <rect x="31" y="35" width="58" height="40" rx="19" fill="#0A1320"/>
      <g class="eyes"><ellipse cx="48" cy="52" rx="6" ry="7" fill="#6FF5E6"/><ellipse cx="72" cy="52" rx="6" ry="7" fill="#6FF5E6"/></g>
      <rect class="mouth" x="51" y="63" width="18" height="4" rx="2" fill="#6FF5E6"/></g>
      <path d="M24 140c2-22 16-35 36-35s34 13 36 35z" fill="#F3F5F7" stroke="#C9D3DC" stroke-width="2"/><circle cx="60" cy="123" r="5" fill="#2EC4B6"/>
    </svg></div>
    <div class="bubble" id="bubble" aria-live="polite"><b class="name" id="bubbleName">Cô Lan Anh</b><span id="bubbleText">Chào con! Cô đang chuẩn bị bài học hôm nay.</span></div>
  </div>
  <div class="statusbar">
    <span class="pill" id="todayPill">Hôm nay 0/30 phút</span>
    <span class="pill timer" id="timerPill" hidden>⏱ 00:00</span>
    <button class="iconbtn" id="askBtn" aria-label="Hỏi cô giáo"></button>
    <button class="iconbtn" id="voiceBtn" aria-label="Chọn giáo viên và giọng nói"></button>
    <button class="iconbtn" id="muteBtn" aria-pressed="false" aria-label="Bật hoặc tắt tiếng"></button>
  </div>
</div>

<main id="main"></main>
<footer class="credit">Designed by Papa-Phí Mạnh Trường</footer>

<nav class="tabs" id="tabs">
  <button data-tab="home" aria-current="page"><span class="ti" data-icon="home"></span>Học</button>
  <button data-tab="mock"><span class="ti" data-icon="mock"></span>Thi thử</button>
  <button data-tab="plan"><span class="ti" data-icon="plan"></span>Lộ trình</button>
  <button data-tab="stickers"><span class="ti" data-icon="stickers"></span>Sticker</button>
  <button data-tab="parent"><span class="ti" data-icon="parent"></span>Bố mẹ</button>
</nav>

<script src="three.min.js"></script>
<script>

const WORDS=[

["diverse","adj","đa dạng","Singapore has a diverse population."],
["eliminate","v","loại bỏ","The aim is to eliminate plastic bags completely."],
["exceed","v","vượt quá","Demand exceeded supply last year."],

["hinder","v","cản trở","Lack of sleep can hinder concentration."],
["implement","v","thực hiện, triển khai","The government implemented a new policy."],
["incentive","n","sự khuyến khích","Tax cuts are an incentive for small businesses."],
["infrastructure","n","cơ sở hạ tầng","Good infrastructure attracts investment."],
["justify","v","biện minh, chứng minh là đúng","It is hard to justify such high prices."],
["legislation","n","luật pháp","New legislation protects consumers."],
["migrate","v","di cư","Many young people migrate to big cities for work."],
["negligible","adj","không đáng kể","The difference in cost is negligible."],
["obsolete","adj","lỗi thời","Some jobs may become obsolete because of AI."],
["perceive","v","nhận thức, cảm nhận","Many people perceive exams as stressful."],
["priority","n","ưu tiên","Safety should be the top priority."],
["prohibit","v","cấm","Smoking is prohibited in public buildings."],
["proportion","n","tỷ lệ","A large proportion of students use phones in class."],

const READING_SET={title:"Green roofs in tropical cities",passage:
"Cities in the tropics are often several degrees hotter than the countryside around them, a pattern known as the urban heat island effect. Concrete and asphalt absorb sunlight during the day and release it slowly at night, so temperatures in dense neighbourhoods rarely fall enough for residents to sleep comfortably. One response that has spread rapidly over the past two decades is the green roof: a layer of soil and plants laid on top of a building.\n\nModern green roofs were pioneered in Germany in the 1970s, but tropical cities have adapted the idea to their own climate. In Singapore, government grants have covered up to half the installation cost for some building owners since 2009. Researchers there found that the surface of a planted roof can be up to 30 degrees cooler than bare concrete on a sunny afternoon, which reduces the energy needed for air-conditioning in the rooms below.\n\nThe benefits are not only thermal. Plants slow the flow of rainwater, easing pressure on drainage systems during heavy storms, and they provide small habitats for birds and insects. However, green roofs are not suitable for every building. Older structures may not be strong enough to carry the extra weight of wet soil, and maintenance costs can be high if owners choose plants that need frequent watering. For this reason, many designers now recommend local species that are adapted to long dry spells followed by intense rain.",
questions:[
{type:"tfng",q:"Green roofs were first developed in tropical cities.",answer:"FALSE",explain:"Bài nói green roofs hiện đại bắt đầu ở Đức (Germany)."},
{type:"tfng",q:"Singapore has offered financial support for green roofs.",answer:"TRUE",explain:"Chính phủ Singapore trợ cấp tới một nửa chi phí."},
{type:"tfng",q:"Most residents of Singapore live in buildings with green roofs.",answer:"NOT GIVEN",explain:"Bài không nói bao nhiêu người sống trong tòa nhà có mái xanh."},
{type:"mcq",q:"Why is it hard to sleep in dense neighbourhoods?",options:["Traffic is noisy at night","Heat is released slowly at night","Air-conditioning is too expensive","There are very few trees"],answer:"Heat is released slowly at night",explain:"Bê tông hấp thụ nắng ban ngày và tỏa nhiệt chậm ban đêm."},
{type:"mcq",q:"What problem can older buildings have?",options:["They cannot support the extra weight","They have no drainage","They receive too much sunlight","They attract too many insects"],answer:"They cannot support the extra weight",explain:"Older structures may not be strong enough to carry the weight."},
{type:"gap",q:"Designers often recommend ______ species of plants.",answer:["local"],explain:"many designers now recommend local species"},
{type:"gap",q:"Plants reduce pressure on ______ systems during storms.",answer:["drainage"],explain:"easing pressure on drainage systems"},
{type:"tfng",q:"Planted roof surfaces can be much cooler than bare concrete.",answer:"TRUE",explain:"Có thể mát hơn tới 30 độ."}
]};

{id:"R03",title:"Why we forget",passage:"Most people worry when they forget a name or a phone number, but forgetting is a normal and even useful part of how memory works. Psychologists have shown that if information is not used, it fades quickly. In a famous series of experiments in the nineteenth century, Hermann Ebbinghaus found that people forgot more than half of a list of nonsense words within an hour.\n\nHowever, Ebbinghaus also discovered that reviewing information at increasing intervals slows down forgetting dramatically. This idea, now called spaced repetition, is the basis of many modern language-learning apps. A learner might review a new word after one day, then after three days, then after a week.\n\nSleep also plays an important role. During deep sleep, the brain appears to replay and strengthen the memories formed during the day. Students who stay up all night before an exam often remember less than those who study for shorter periods and sleep well.\n\nFinally, researchers suggest that forgetting helps us focus. By losing details that are no longer relevant, the brain makes it easier to find the information we actually need.",questions:[

function clone(x){return JSON.parse(JSON.stringify(x))}
function mergeDefaults(x){x=clone(x||{});const s=Object.assign(clone(DEFAULT),x);s.settings=Object.assign({},DEFAULT.settings,x.settings||{});s.stickers=Object.assign({},DEFAULT.stickers,x.stickers||{});s.flags=s.flags||{};if(!s.settings.childName||s.settings.childName==="con")s.settings.childName="Ngân Hà";return s}

async function initStore(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw)S=mergeDefaults(JSON.parse(raw))}catch(e){}
  if(!S.firstDay){S.firstDay=dayKey();persistLocal()}
  applyBand5();loadRemoteTests();
  render();greet();
  if(!window.claude||!claude.use)return;
  try{db=await claude.use("db")}catch(e){db=null}
  if(!db)return;
  docRef=db.doc("app/state");
  try{const snap=await docRef.get();
    if(snap.exists){S=mergeDefaults(snap.data());applyBand5();persistLocal();if(welcomeOpen)showWelcome(false);else if(!session)render()}else{save()}
  }catch(e){}
  try{docRef.onSnapshot(snap=>{if(!snap.exists||session)return;const d=snap.data();if(JSON.stringify(d)===JSON.stringify(S))return;S=mergeDefaults(d);persistLocal();if(!busyTyping())render()},()=>{})}catch(e){}
}

/* ============ Utils ============ */
const $=s=>document.querySelector(s);
const main=$("#main");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function dayKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addDays(k,n){const[y,m,d]=k.split("-").map(Number);const dt=new Date(y,m-1,d+n);return dayKey(dt)}
function fmtTime(s){s=Math.floor(s);return `${pad(Math.floor(s/60))}:${pad(s%60)}`}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function roundBand(x){return Math.max(0,Math.min(9,Math.round(x*2)/2))}
function vnd(n){return n.toLocaleString("vi-VN")+"đ"}
function norm(s){return String(s).toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9:. ]/g," ").replace(/\s+/g," ").trim().replace(/\.$/,"")}
function rawToBand(raw40){const t=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]];for(const[r,b]of t)if(raw40>=r)return b;return 2}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function modal(html,buttons){return new Promise(res=>{const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}<div class="row" style="margin-top:16px;justify-content:flex-end">${buttons.map((b,i)=>`<button class="btn ${b.cls||""}" data-i="${i}">${esc(b.label)}</button>`).join("")}</div></div>`;document.body.appendChild(m);const inp=m.querySelector("input");if(inp)setTimeout(()=>inp.focus(),50);m.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const val=inp?inp.value:null;m.remove();res({i:+b.dataset.i,value:val})})})}

/* ============ 3D robot teacher ============ */
const Robot=(()=>{
  const none={init(){return false},mood(){},talk(){},pulse(){},gesture(){},setAccent(){}};
  if(!window.THREE)return none;
  let renderer,scene,cam,pivot,inner,armPivot,running=false;const eyes=[],brows=[],bars=[],glowMats=[],cheeks=[];
  let moodT="neutral",talking=false,amp=0,gest=null,gT=0,nextBlink=2.5,blinkEnd=0;
  const clock=new THREE.Clock(),accent=new THREE.Color(0x2ec4b6);
  const M={neutral:{eyeY:1,eyeUp:0,brow:0,browUp:0,smile:.5},happy:{eyeY:.42,eyeUp:.025,brow:0,browUp:.035,smile:1.5},firm:{eyeY:.75,eyeUp:0,brow:-.38,browUp:-.02,smile:-.5},concerned:{eyeY:.85,eyeUp:0,brow:.38,browUp:.02,smile:-.7},thinking:{eyeY:.9,eyeUp:.02,brow:.22,browUp:.03,smile:.1}};
  const cur={...M.neutral};
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function onHead(m,theta,phi,r){const x=-r*Math.cos(phi)*Math.sin(theta),y=r*Math.cos(theta),z=r*Math.sin(phi)*Math.sin(theta);m.position.set(x,y,z);m.rotation.order="YXZ";m.rotation.y=Math.atan2(x,z);m.rotation.x=-(Math.PI/2-theta);return m}
  function init(canvas){
    try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});if(!renderer.getContext())return false}catch(e){return false}
    renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.outputEncoding=THREE.sRGBEncoding;
    scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(30,1,.1,50);cam.position.set(0,.05,6.6);cam.lookAt(0,0,0);
    scene.add(new THREE.HemisphereLight(0xffffff,0x6b7d8c,.9));
    const key=new THREE.DirectionalLight(0xffffff,.85);key.position.set(2.5,3,4);scene.add(key);
    const rim=new THREE.DirectionalLight(0x9fe8ff,.45);rim.position.set(-3,1.5,-2.5);scene.add(rim);
    const white=new THREE.MeshStandardMaterial({color:0xf3f5f7,roughness:.32,metalness:.05});
    const grey=new THREE.MeshStandardMaterial({color:0x8d99a6,roughness:.45,metalness:.45});
    const visor=new THREE.MeshStandardMaterial({color:0x0a1320,roughness:.18,metalness:.55,side:THREE.DoubleSide});
    const glow=()=>{const m=new THREE.MeshBasicMaterial({color:accent.clone()});glowMats.push(m);return m};
    const eyeMat=new THREE.MeshBasicMaterial({color:0x6ff5e6});
    const torso=new THREE.Mesh(new THREE.SphereGeometry(.85,40,28),white);torso.scale.set(1.18,.82,.78);torso.position.y=-1.42;scene.add(torso);
    const chest=new THREE.Mesh(new THREE.CircleGeometry(.11,32),glow());chest.position.set(0,-1.2,.645);scene.add(chest);
    const neck=new THREE.Mesh(new THREE.CylinderGeometry(.2,.26,.4,24),grey);neck.position.y=-.62;scene.add(neck);
    [-1,1].forEach(s=>{const sh=new THREE.Mesh(new THREE.SphereGeometry(.27,24,18),white);sh.position.set(s,-1,0);scene.add(sh)});
    armPivot=new THREE.Group();armPivot.position.set(1,-1,0);scene.add(armPivot);
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(.13,.12,.8,20),white);arm.position.y=-.45;armPivot.add(arm);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.15,20,14),grey);hand.position.y=-.9;armPivot.add(hand);
    pivot=new THREE.Group();pivot.position.y=-.45;scene.add(pivot);
    inner=new THREE.Group();inner.position.y=.85;inner.scale.set(1.08,.95,1);pivot.add(inner);
    inner.add(new THREE.Mesh(new THREE.SphereGeometry(1,56,40),white));
    inner.add(new THREE.Mesh(new THREE.SphereGeometry(1.012,56,40,Math.PI/2-.88,1.76,.9,1.2),visor));
    [-1,1].forEach(s=>{
      const ear=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.14,32),grey);ear.rotation.z=Math.PI/2;ear.position.x=s*1.02;inner.add(ear);
      const ring=new THREE.Mesh(new THREE.TorusGeometry(.16,.03,10,36),glow());ring.rotation.y=Math.PI/2;ring.position.x=s*1.1;inner.add(ring);
      eyes.push(onHead(new THREE.Mesh(new THREE.CircleGeometry(.12,32),eyeMat),1.4,Math.PI/2+s*.33,1.03));
      brows.push(onHead(new THREE.Mesh(new THREE.PlaneGeometry(.2,.035),eyeMat),1.16,Math.PI/2+s*.33,1.03));
      cheeks.push(onHead(new THREE.Mesh(new THREE.CircleGeometry(.07,24),new THREE.MeshBasicMaterial({color:0xff8fb1,transparent:true,opacity:.55})),1.62,Math.PI/2+s*.56,1.03));
    });
    eyes.concat(brows,cheeks).forEach(m=>inner.add(m));
    for(let i=-3;i<=3;i++){const b=onHead(new THREE.Mesh(new THREE.PlaneGeometry(.05,.06),eyeMat),1.8,Math.PI/2+i*.075,1.03);b.userData.i=i;bars.push(b);inner.add(b)}
    const ant=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.3,12),grey);ant.position.y=1.1;inner.add(ant);
    const ball=new THREE.Mesh(new THREE.SphereGeometry(.07,16,12),glow());ball.position.y=1.28;inner.add(ball);
    resize();addEventListener("resize",resize);
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!running){clock.getDelta();loop()}});
    loop();return true;
  }
  function resize(){const c=renderer.domElement,w=c.clientWidth||84,h=c.clientHeight||100;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
  function loop(){
    if(document.visibilityState!=="visible"){running=false;return}
    running=true;requestAnimationFrame(loop);
    const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime,tg=M[moodT]||M.neutral;
    for(const k in cur)cur[k]+=(tg[k]-cur[k])*Math.min(1,dt*6);
    if(t>nextBlink){blinkEnd=t+.13;nextBlink=t+2.5+Math.random()*3}
    const blink=t<blinkEnd?.1:1;
    eyes.forEach((e,i)=>{onHead(e,1.4-cur.eyeUp*4,Math.PI/2+(i?1:-1)*.33,1.03);e.scale.y=cur.eyeY*blink});
    brows.forEach((b,i)=>{const s=i?1:-1;onHead(b,1.16-cur.browUp*4,Math.PI/2+s*.33,1.03);b.rotation.z=-s*cur.brow});
    amp=talking?Math.max(amp*.9,.25):amp*.85;
    bars.forEach(b=>{const i=b.userData.i;onHead(b,1.8-cur.smile*.0045*i*i,Math.PI/2+i*.075,1.03);const lv=talking?(.5+.5*Math.sin(t*22+i*1.7))*(1-Math.abs(i)/5):0;b.scale.y=1+amp*lv*6});
    const k=.65+.35*(talking?(.5+.5*Math.sin(t*10)):.4+.3*Math.sin(t*1.5));
    glowMats.forEach(m=>m.color.copy(accent).multiplyScalar(k));
    let rx=reduce?0:.04*Math.sin(t*.8),ry=reduce?0:.14*Math.sin(t*.45),rz=reduce?0:.03*Math.sin(t*.7),arm=.08;
    if(talking&&!reduce)rx+=.03*Math.sin(t*5.5);
    if(gest&&!reduce){const g=t-gT,d=Math.max(0,1-g/1.4);
      if(gest==="nod")rx+=.2*Math.sin(g*11)*d;
      if(gest==="shake")ry+=.32*Math.sin(g*13)*d;
      if(gest==="tilt")rz+=.16*Math.sin(Math.min(g,1.2)/1.2*Math.PI);
      if(gest==="wave")arm=2.6*Math.min(1,g*3)*(g<1.6?1:Math.max(0,1-(g-1.6)*2))+.25*Math.sin(t*9)*(g<1.6?1:0);
      if(g>2.2)gest=null}
    pivot.rotation.set(rx,ry,rz);armPivot.rotation.z=arm;
    renderer.render(scene,cam);
  }
  return {init,mood(m){moodT=m},talk(on){talking=on;if(on)amp=.6},pulse(){amp=1},gesture(g){gest=g;gT=clock.elapsedTime},setAccent(hex,ck){accent.setHex(hex);cheeks.forEach(c=>c.visible=!!ck)}};
})();

/* ============ Teacher voice ============ */
const avatar=$("#avatar");let muted=false,voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){voices=[]}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function voicesFor(l){return voices.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith(l))}
const MALE_EN=/daniel|arthur|oliver|george|ryan|guy|thomas|rishi|aaron|\bmale\b/i;
function pickVoice(lang){
  const list=voicesFor(lang==="vi"?"vi":"en");if(!list.length)return null;
  const chosen=lang==="vi"?VS.vi:VS.en;if(chosen){const v=list.find(v=>v.voiceURI===chosen);if(v)return v}
  const p=persona();
  if(lang==="vi")return list.find(v=>p.hint.test(v.name))||list[0];
  const gb=list.filter(v=>/en-gb/i.test((v.lang||"").replace("_","-"))).concat(list);
  const g=p.male?MALE_EN:/serena|kate|sonia|libby|martha|samantha|karen|moira|tessa|stephanie|catherine|female/i;
  return gb.find(v=>g.test(v.name))||gb[0];
}
function duoVoices(){const L=voicesFor("en");if(!L.length)return [null,null];
  const q=v=>(/premium|enhanced|siri|natural|neural|online/i.test(v.name)?4:0)+(/en-(gb|au|ie|nz)/i.test((v.lang||"").replace("_","-"))?2:0)+(v.localService===false?1:0);
  const best=a=>a.slice().sort((x,y)=>q(y)-q(x))[0];
  const men=L.filter(v=>MALE_EN.test(v.name)),women=L.filter(v=>!MALE_EN.test(v.name)&&!/novelty|whisper|bells|bubbles|organ|zarvox|trinoids|cellos|bad news|good news|jester|superstar|wobble|boing|bahh|albert|fred|junior|ralph/i.test(v.name));
  const a=best(women)||best(L),b=best(men)||L.find(v=>v!==a)||a;return [a,b]}
function T(s){if(!persona().male)return s;return s.replace(/(^|[\s,.!?“"])Cô(?=[\s,.!?]|$)/g,"$1Thầy").replace(/(^|[\s,.!?“"])cô(?=[\s,.!?]|$)/g,"$1thầy")}
function viText(s){s=T(s);if(VS.teacher==="mai-nam")s=s.replace(/ nhé/g," nha").replace(/ đấy/g," đó");return s}
function speak(text,lang="en",opts={}){return new Promise(res=>{
  if(muted||!("speechSynthesis" in window)||!text){res();return}
  const v=opts.voice||pickVoice(lang);if(lang==="vi"&&!v){res();return}
  const p=persona(),soft=VS.speed!=="normal";
  const u=new SpeechSynthesisUtterance(text);if(v)u.voice=v;u.lang=lang==="vi"?"vi-VN":(v?v.lang:"en-GB");
  const maleVoice=!!v&&(lang==="en"?MALE_EN.test(v.name):(p.male&&p.hint.test(v.name)));
  u.rate=opts.rate||(lang==="vi"?(soft?.92:1):(soft?.88:.97));
  u.pitch=opts.pitch||(p.male?(maleVoice?1:.8):1.08);
  u.onstart=()=>{avatar.classList.add("talking");Robot.talk(true)};
  u.onboundary=()=>Robot.pulse();
  u.onend=u.onerror=()=>{avatar.classList.remove("talking");Robot.talk(false);res()};
  speechSynthesis.speak(u);
})}
function say(en,vi,firm=false,mood){
  mood=mood||(firm?"firm":"neutral");const v=vi?viText(vi):"";
  $("#bubble").classList.toggle("firm",!!firm);
  $("#bubbleText").innerHTML=(en?esc(en):"")+(v?`<span class="vi">${esc(v)}</span>`:"");
  try{speechSynthesis.cancel()}catch(e){}
  Robot.mood(mood);if(firm)Robot.gesture("shake");else if(mood==="happy")Robot.gesture(Math.random()<.5?"nod":"wave");else Robot.gesture("tilt");
  (async()=>{if(en)await speak(en,"en");if(v)await speak(v,"vi");if(mood!=="neutral")setTimeout(()=>Robot.mood("neutral"),2500)})();
}
function setMuteUI(){const b=$("#muteBtn");b.innerHTML=icon(muted?"mute":"sound")+`<span>${muted?"Tắt":"Tiếng"}</span>`;b.setAttribute("aria-pressed",muted)}
$("#muteBtn").onclick=()=>{muted=!muted;setMuteUI();if(muted)try{speechSynthesis.cancel()}catch(e){}};

  <label class="f" for="ven">Giọng tiếng Anh</label><select id="ven">${opt(en,VS.en)}</select>
  <label class="f" for="vsp">Tốc độ</label><select id="vsp"><option value="soft" ${VS.speed!=="normal"?"selected":""}>Chậm rãi, nhẹ nhàng</option><option value="normal" ${VS.speed==="normal"?"selected":""}>Bình thường</option></select>
  <div class="row" style="margin-top:14px"><button class="btn ghost small" id="vtest">Nghe thử</button><span style="flex:1"></span><button class="btn ghost small" id="vno">Huỷ</button><button class="btn teal small" id="vok">Lưu</button></div></div>`;
  document.body.appendChild(m);
  const read=()=>{VS.teacher=m.querySelector('input[name=pt]:checked').value;VS.vi=m.querySelector("#vvi").value;VS.en=m.querySelector("#ven").value;VS.speed=m.querySelector("#vsp").value};
  const old=JSON.stringify(VS);
  m.querySelector("#vtest").onclick=async()=>{read();applyPersona();try{speechSynthesis.cancel()}catch(e){}const w=muted;muted=false;Robot.mood("happy");Robot.gesture("wave");await speak("Hi! I'm right here with you. Let's learn a little every day.","en");await speak(viText("Cô ở đây cùng con. Mỗi ngày mình học một chút thôi nhé."),"vi");muted=w;Robot.mood("neutral")};
  m.querySelector("#vno").onclick=()=>{Object.assign(VS,JSON.parse(old));applyPersona();m.remove()};
  m.querySelector("#vok").onclick=()=>{read();saveVS();m.remove();say("Lovely. I'll talk to you like this from now on.","Từ giờ cô sẽ nói với con bằng giọng này nhé.",false,"happy")};
}

/* ============ Session timing ============ */
let session=null,lastAct=Date.now();
["pointerdown","keydown","scroll","input"].forEach(ev=>addEventListener(ev,()=>lastAct=Date.now(),{passive:true}));
function beginSession(type,extra={}){session={type,start:new Date().toISOString(),active:0,rushed:0,firmRush:false,...extra};main.style.setProperty("--skill",SKILL_COLOR[type]||"");$("#tabs").classList.add("locked");$("#timerPill").hidden=false;tick()}
function speakingNow(){try{return speechSynthesis.speaking}catch(e){return false}}
function tick(){
  if(session){const idle=Date.now()-lastAct>90000&&!speakingNow()&&!session.listening;const visible=document.visibilityState==="visible";
    if(!idle&&visible)session.active++;
    const tp=$("#timerPill");tp.textContent=(idle||!visible?"⏸ ":"⏱ ")+fmtTime(session.active);tp.classList.toggle("paused",idle||!visible);
    if(session.countdown!=null){session.countdown--;const c=$("#countdown");if(c)c.textContent=fmtTime(Math.max(0,session.countdown));if(session.countdown===300)say("Five minutes left. Check your answers carefully.");if(session.countdown<=0&&session.onTimeUp){const f=session.onTimeUp;session.onTimeUp=null;session.countdown=null;f()}}
  }
  updateTodayPill();
}
setInterval(tick,1000);
function dayMinutes(k){let s=S.sessions.filter(x=>x.date===k).reduce((a,x)=>a+(x.secs||0),0);if(session&&k===dayKey())s+=session.active;return s/60}
function updateTodayPill(){const m=Math.floor(dayMinutes(dayKey()));const goal=S.settings.dailyMin;const p=$("#todayPill");p.textContent=`Hôm nay ${m}/${goal} phút${m>=goal?" ✓":""}`;p.style.background=m>=goal?"var(--good-bg)":""}
function endSession(score,details={},opts={}){
  try{syncSoon()}catch(e){}
  const s=session;if(!s)return null;
  const rec={id:Date.now().toString(36),date:dayKey(),type:s.type,start:s.start,secs:s.active,score:score==null?null:Math.round(score*10)/10,band:details.band??null,rushed:s.rushed,status:opts.abandoned?"bỏ dở":"xong",details};
  const before=dayMinutes(dayKey())-s.active/60;
  session=null;$("#tabs").classList.remove("locked");$("#timerPill").hidden=true;
  S.sessions.push(rec);if(S.sessions.length>500)S.sessions=S.sessions.slice(-500);
  let gained=0;
  if(!opts.abandoned){const r=stickerRules(s.type,rec,details);gained=r.n;rec.stickerWhy=r.why}
  const after=dayMinutes(dayKey());
  rec.justCompletedDay=before<S.settings.dailyMin&&after>=S.settings.dailyMin;
  if(rec.justCompletedDay){const st=streakDays();if(st>0&&st%7===0&&!(S.flags.streak||{})[rec.date]){S.flags.streak=Object.assign({},S.flags.streak,{[rec.date]:1});gained++;rec.bonus=1;(rec.stickerWhy=rec.stickerWhy||[]).push(`Thưởng chăm chỉ: ${st} ngày liên tiếp học đủ ${S.settings.dailyMin} phút`)}}
  if(gained){S.stickers.earned+=gained;rec.stickers=gained}
  if(!opts.abandoned&&s.type!=="placement")S.pendingSurvey=rec.id;
  save();postLog(rec);
  return rec;
}
/* Luật sticker: đạt chuẩn giai đoạn · phá kỷ lục · chăm chỉ 7 ngày; làm vội từ 3 lần không tính; tối đa stickerCap/ngày */
function stickerTarget(){return planInfo().phase.target}
function stickerRules(type,rec,details){
  const why=[];let n=0;const target=stickerTarget();
  if(type==="placement")return {n:0,why};
  if(details&&details.kind==="cam"&&!details.fallback&&!(["ai","auto","parent"].includes(details.verify)&&!details.dispute))return {n:0,why:["Điểm đề sách Cambridge / đề online do con tự chấm nên được ghi lại để theo dõi, không tính sticker."]};
  if((rec.rushed||0)>=3)return {n:0,why:["Bài này làm vội từ 3 lần trở lên nên chưa tính sticker. Lần sau đọc chậm lại nhé!"]};
  if(type==="vocab"){if(rec.score!=null&&rec.score>=8){n++;why.push("Từ vựng đạt từ 8/10")}}
  else if(type==="mock"){if(details&&details.bands){const k=Object.values(details.bands).filter(b=>b>=target).length;if(k){n+=k;why.push(`${k} kỹ năng thi thử đạt từ band ${target}`)}}}
  else if(rec.band!=null){
    if(rec.band>=target){n++;why.push(`Đạt band ${rec.band}, từ mục tiêu giai đoạn ${target} trở lên`)}
    const prev=S.sessions.filter(x=>x!==rec&&x.type===type&&x.band!=null).map(x=>x.band);
    if(prev.length&&rec.band>Math.max(...prev)){n++;why.push(`Kỷ lục mới môn ${SKILL_NAME[type]}: band ${rec.band} (cao nhất trước đó ${Math.max(...prev)})`)}
  }
  const cap=Math.max(1,parseInt(S.settings.stickerCap)||3);
  const used=S.sessions.filter(x=>x!==rec&&x.date===rec.date).reduce((a,x)=>a+(x.stickers||0)-(x.bonus||0),0);
  if(n>cap-used){n=Math.max(0,cap-used);why.push(`Hôm nay đã đủ ${cap} sticker tối đa`)}
  return {n,why};
}
function streakDays(){let k=dayKey(),c=0;for(let i=0;i<400;i++){if(dayMinutes(k)>=S.settings.dailyMin||S.dayOffs.includes(k)){c++;k=addDays(k,-1)}else break}return c}
function stickerHint(type){const t=stickerTarget();return type==="vocab"?"Đạt từ 8/10 để nhận sticker.":`Đạt từ band ${t} (mục tiêu giai đoạn này) hoặc phá kỷ lục band của con để nhận sticker.`}
async function confirmQuit(){
  const r=await modal(`<h3>Dừng bài này?</h3><p>Con đã học ${fmtTime(session.active)}. Thời gian vẫn được tính, nhưng bài sẽ ghi là <b>bỏ dở</b> và không có điểm.</p>`,[{label:"Học tiếp",cls:"teal"},{label:"Dừng",cls:"ghost"}]);
  if(r.i!==1)return;
  const mins=session.active/60;endSession(null,{},{abandoned:true});
  if(mins<5)say("Let's not give up so quickly.",FIRM.quit,true);
  tab="home";render();
}

/* ============ Navigation ============ */
let tab="home",parentUnlocked=false;
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{welcomeOpen=false;tab=b.dataset.tab;render();scrollTo(0,0)});
function setTabUI(){document.querySelectorAll(".tabs button").forEach(b=>b.toggleAttribute("aria-current",b.dataset.tab===tab)||b.dataset.tab===tab&&b.setAttribute("aria-current","page"))}

function surveyInsights(sv){
  const out=[];if(!sv.n)return out;const share=(arr,re)=>arr.filter(([k])=>re.test(k)).reduce((a,[,v])=>a+v,0)/sv.n;

function dictLines(){const out=[];LISTENING_BANK.forEach(set=>set.lines.forEach(l=>{const n=l.text.split(/\s+/).length;if(n>=6&&n<=18)out.push({id:set.id+":"+l.text.slice(0,24),text:l.text,sp:l.speaker})}));return out}
function startDictation(){

  const show=()=>{
    if(i>=items.length){const pct=tot?ok/tot:0;const rec=endSession(pct*10,{kind:"dict",correct:ok,total:tot,title:"Nghe chép chính tả"});
      showResult(rec,`Nghe chép chính tả: ${ok}/${tot} từ đúng (${Math.round(pct*100)}%)`,`<p class="small muted">Chữ gạch đỏ là chữ con nghe sai – nghe lại và đọc to câu đó 2 lần.</p>${res.map(r=>`<p class="small">${r.html}</p>`).join("")}`);return}
    const it=items[i];let plays=0;
    main.innerHTML=`${sessionHead("Nghe chép chính tả")}<div class="progress"><i style="width:${i/items.length*100}%"></i></div><p class="muted small">Câu ${i+1}/${items.length} · được nghe 3 lần</p><div class="panel"><div class="row"><button class="btn teal" id="pl">🔊 Nghe câu</button><button class="btn ghost" id="sl">🐢 Nghe chậm</button></div><textarea id="dt" style="margin-top:10px;min-height:90px" autocapitalize="off" spellcheck="false" placeholder="Gõ lại câu con nghe được"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="ck">Kiểm tra</button></div><div id="fb"></div></div>`;
    bindQuit();const play=r=>{if(plays>=3){toast("Hết 3 lượt nghe.");return}plays++;speak(it.text,"en",{rate:r,pitch:it.sp==="A"?1.25:.85})};

    $("#ck").onclick=()=>{const a=$("#dt").value.trim();if(!a){toast("Con gõ câu nghe được trước nhé.");return}

      $("#ck").textContent=i===items.length-1?"Xem kết quả":"Câu tiếp";$("#ck").onclick=()=>{i++;show()}};

async function proofPut(id,arr){try{const db=await pdb();await new Promise((res,rej)=>{const t=db.transaction("img","readwrite");t.objectStore("img").put({arr,t:Date.now()},id);t.oncomplete=res;t.onerror=()=>rej(t.error)});const st=db.transaction("img","readwrite").objectStore("img"),cur=st.openCursor(),lim=Date.now()-45*864e5;cur.onsuccess=()=>{const c=cur.result;if(!c)return;if(c.value.t<lim)c.delete();c.continue()}}catch(e){}}

function addFrame(st,src,w,h){const sc=Math.min(1,1400/Math.max(w,h));const cv=document.createElement("canvas");cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height);

function scrStop(){if(!SCR.st)return [];if(SCR.on)SCR.grab();clearInterval(SCR.iv);SCR.on=false;try{SCR.st.getTracks().forEach(t=>t.stop())}catch(e){}const o=SCR.out.slice(-16);SCR={on:false};return o}

function videoFrames(file,onProg){return new Promise(res=>{
  const url=URL.createObjectURL(file),v=document.createElement("video");v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";v.src=url;
  const out=[],sig=[];let done=false;const end=()=>{if(done)return;done=true;URL.revokeObjectURL(url);res(out)};setTimeout(end,90000);
  const grab=()=>new Promise(r=>{let ok=false;const f=()=>{if(ok)return;ok=true;v.removeEventListener("seeked",f);r()};v.addEventListener("seeked",f);setTimeout(f,4000)});
  v.onerror=end;
  v.onloadedmetadata=async()=>{
    try{await v.play();v.pause()}catch(e){}
    const d=isFinite(v.duration)&&v.duration>0?v.duration:0;if(!d){end();return}
    const ts=[];for(let i=0;i<8;i++)ts.push(d*(0.05+0.75*i/7));for(let i=0;i<10;i++)ts.push(d*(0.8+0.195*i/9));
    const st={out,sig};
    for(let n=0;n<ts.length;n++){if(done)return;v.currentTime=Math.min(ts[n],d-0.05);await grab();
      try{addFrame(st,v,v.videoWidth,v.videoHeight)}catch(e){}
      onProg&&onProg(n+1,ts.length)}
    end()};
})}
async function aiCheckProof(imgs,first,childAns,isVideo){

  const content=imgs.map(u=>({type:"image",source:{type:"base64",media_type:u.slice(5,u.indexOf(";")),data:u.slice(u.indexOf(",")+1)}}));
  content.push({type:"text",text:`${isVideo?`These are frames from a screen recording of the student doing an IELTS Listening practice test (questions ${first}-${first+9}), in time order. The student's final answer for each question is the LAST visible version of it.`:`These are screenshots/photos from an IELTS Listening practice test, questions ${first}-${first+9}.`} ${childAns?`The student typed these answers in another app: ${JSON.stringify(childAns.map((a,k)=>({q:first+k,student:a||""})))}. The images show the official answer key.`:`The images show the student's own typed answers on the test page and the official answer key.`}
For each question ${first}..${first+9} give: student = the student's answer exactly as written (null if not visible), key = the official answer (null if not visible), correct = true/false using official IELTS marking (not case-sensitive; spelling must be exact; words in brackets are optional; "/" means alternatives; numbers may be digits or words), or null if the student's answer or the key is not visible. Never guess.
Reply with JSON only: {"items":[{"q":${first},"student":"...","key":"...","correct":true}],"note":"one short sentence in Vietnamese if something was unclear, else empty"}`});
  try{const r=await sample.json([{role:"user",content}],{modelTier:"default"});
    if(!r||!Array.isArray(r.items))return null;const items=r.items.filter(it=>it&&it.q>=first&&it.q<=first+9);
    const need=childAns?Math.max(1,childAns.filter(Boolean).length):8;if(items.filter(it=>it.correct===true||it.correct===false).length<need)return null;

}
